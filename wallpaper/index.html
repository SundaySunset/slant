  <script id="vs-source" type="x-shader/x-vertex">
    attribute vec2 a_position;
    void main() { gl_Position = vec4(a_position, 0.0, 1.0); }
  </script>

  <script id="fs-source" type="x-shader/x-fragment">
    precision highp float;

    uniform vec2  u_resolution;
    uniform float u_time;

    uniform sampler2D u_texNear;
    uniform sampler2D u_texFar;
    uniform sampler2D u_texRain;
    uniform sampler2D u_texBird;

    uniform float u_halfSpanX;
    uniform float u_W;
    uniform float u_winSide;
    uniform vec4  u_winRect;
    uniform vec2  u_treeDepths;
    uniform float u_mullionMode;

    uniform float u_r;
    uniform float u_s;
    uniform float u_beamFade;
    uniform vec3  u_beamColor;
    uniform float u_beamPower;
    uniform float u_isMoon;
    uniform float u_sunsetHeat;
    uniform float u_dawnWarmth;
    uniform float u_sunsetDrama;

    uniform float u_penScale;
    uniform float u_wallMat;
    uniform float u_wallTex;
    uniform vec2  u_rainParams;
    uniform vec3  u_weatherFx;
    uniform vec4  u_lightning;
    uniform float u_windMs;
    uniform float u_dustOn;

    uniform vec4  u_bird0;
    uniform vec4  u_bird1;
    uniform vec2  u_birdBlur;

    uniform vec3  u_ambientCol;
    uniform vec3  u_leftGlowCol;
    uniform vec3  u_rightGlowCol;
    uniform vec3  u_horizonGlowCol;

    float hash12(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    float interleavedGradientNoise(vec2 fragCoord) {
      vec3 magic = vec3(0.06711056, 0.00583715, 52.9829189);
      return fract(magic.z * fract(dot(fragCoord, magic.xy)));
    }

    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
      float a = hash12(i);
      float b = hash12(i + vec2(1.0, 0.0));
      float c = hash12(i + vec2(0.0, 1.0));
      float d = hash12(i + vec2(1.0, 1.0));
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }

    float evalWallHeight(vec2 p, out float tonalVar) {
      const mat2 rot1 = mat2( 0.829,  0.559, -0.559,  0.829);
      const mat2 rot2 = mat2(-0.374,  0.927, -0.927, -0.374);
      const mat2 rot3 = mat2( 0.616, -0.788,  0.788,  0.616);
      tonalVar = 1.0;

      if (u_wallMat < 0.5) {
        float broad = vnoise(p * 4.5 + vec2(2.3, 6.1)) * 0.10;
        float s1 = smoothstep(0.14, 0.88, vnoise(rot1 * p * 142.0 + vec2(13.7, 9.2))) * 0.44;
        float s2 = vnoise(rot2 * p * 262.0 + vec2(37.4, 21.8)) * 0.32;
        float s3 = vnoise(rot3 * p * 438.0 + vec2(5.9, 51.3)) * 0.14;
        return broad + s1 + s2 + s3;
      } else if (u_wallMat < 1.5) {
        vec2 warp = vec2(vnoise(p * 2.4 + vec2(1.2, 4.7)), vnoise(p * 2.4 + vec2(8.3, 2.1))) * 0.42;
        float trowel1 = vnoise((p + warp) * vec2(3.6, 6.8) + vec2(3.1, 7.4));
        float trowel2 = vnoise(rot1 * (p + warp * 0.5) * 14.0 + vec2(19.2, 4.8));
        float mineral = vnoise(rot2 * p * 175.0 + vec2(11.1, 29.4));
        float pores   = smoothstep(0.12, 0.42, vnoise(rot3 * p * 340.0 + vec2(7.3, 15.6)));
        tonalVar = 1.0 + ((trowel1 * 0.65 + trowel2 * 0.35) - 0.5) * 0.085 * (0.45 + 0.55 * u_wallTex);
        return trowel1 * 0.24 + trowel2 * 0.22 + mineral * 0.32 + pores * 0.22;
      } else {
        float warpSlub = vnoise(vec2(p.x * 26.0, p.y * 4.5) + vec2(4.2, 9.1));
        float weftSlub = vnoise(vec2(p.x * 4.5, p.y * 26.0) + vec2(15.7, 2.8));
        float warpLine = 0.5 + 0.5 * sin(p.x * 465.0 + warpSlub * 2.1);
        float weftLine = 0.5 + 0.5 * sin(p.y * 440.0 + weftSlub * 2.1);
        float paperGrain = vnoise(rot1 * p * 210.0 + vec2(6.4, 31.2));
        float weave = (warpLine * (0.55 + 0.45 * warpSlub) + weftLine * (0.55 + 0.45 * weftSlub)) * 0.5;
        tonalVar = 1.0 + (weave - 0.5) * 0.022 * u_wallTex + (warpSlub + weftSlub - 1.0) * 0.018 * u_wallTex;
        return weave * 0.58 + paperGrain * 0.32 + (warpSlub * 0.05 + weftSlub * 0.05);
      }
    }

    vec3 computeWallNormal(vec2 p, out float hVal, out float tonalVar) {
      float eps = 0.00115;
      float dummy = 1.0;
      hVal = evalWallHeight(p, tonalVar);
      float hx = evalWallHeight(p + vec2(eps, 0.0), dummy);
      float hy = evalWallHeight(p + vec2(0.0, eps), dummy);
      vec2 grad = vec2(hx - hVal, hy - hVal) / eps;
      float slopeGain = u_wallMat < 0.5 ? 0.0033 : (u_wallMat < 1.5 ? 0.0038 : 0.0024);
      return normalize(vec3(-grad.x * slopeGain, -grad.y * slopeGain, 1.0));
    }

    float sampleTreeVogel24(sampler2D tex, vec2 uv, float rawRadius, float jitter) {
      const float GOLDEN_ANGLE = 2.39996323;
      float radius = clamp(rawRadius, 0.0018, 0.062);
      float acc = 0.0;
      float wSum = 0.0;
      for (int i = 0; i < 24; i++) {
        float fi = float(i);
        float r = sqrt((fi + 0.5) / 24.0);
        float theta = fi * GOLDEN_ANGLE + jitter;
        vec2 suv = uv + vec2(cos(theta), sin(theta)) * (r * radius);
        float edgeMask = smoothstep(0.02, 0.065, suv.x) * smoothstep(0.98, 0.935, suv.x)
                       * smoothstep(0.02, 0.065, suv.y) * smoothstep(0.98, 0.935, suv.y);
        float w = 1.0 - 0.52 * r * r;
        acc += texture2D(tex, clamp(suv, 0.0, 1.0)).a * edgeMask * w;
        wSum += w;
      }
      return acc / max(wSum, 0.001);
    }

    float sampleBirdSlot12(vec2 wallPos, vec4 bRect, float blurWall, float slotOffsetX, float jitter) {
      if (bRect.w <= 0.001) return 0.0;
      vec2 local = (wallPos - bRect.xy) / max(bRect.z, 0.05) + 0.5;
      if (local.x < -0.14 || local.x > 1.14 || local.y < -0.14 || local.y > 1.14) return 0.0;

      const float GOLDEN_ANGLE = 2.39996323;
      float rUV = clamp(blurWall / max(bRect.z, 0.05), 0.010, 0.12);

      float acc = 0.0;
      float wSum = 0.0;
      for (int i = 0; i < 12; i++) {
        float fi = float(i);
        float r = sqrt((fi + 0.5) / 12.0);
        float theta = fi * GOLDEN_ANGLE + jitter;
        vec2 suv = local + vec2(cos(theta), sin(theta)) * (r * rUV);
        float inTile = smoothstep(0.01, 0.04, suv.x) * smoothstep(0.99, 0.96, suv.x)
                     * smoothstep(0.01, 0.04, suv.y) * smoothstep(0.99, 0.96, suv.y);
        vec2 atlasUV = vec2(slotOffsetX + clamp(suv.x, 0.0, 1.0) * 0.5, clamp(suv.y, 0.0, 1.0));
        float w = 1.0 - 0.45 * r * r;
        acc += texture2D(u_texBird, atlasUV).a * inTile * w;
        wSum += w;
      }
      return (acc / max(wSum, 0.001)) * bRect.w;
    }

    float sampleTreeVogel12(sampler2D tex, vec2 uv, float rawRadius, float jitter) {
      const float GOLDEN_ANGLE = 2.39996323;
      float radius = clamp(rawRadius, 0.0018, 0.052);
      float acc = 0.0;
      float wSum = 0.0;
      for (int i = 0; i < 12; i++) {
        float fi = float(i);
        float r = sqrt((fi + 0.5) / 12.0);
        float theta = fi * GOLDEN_ANGLE + jitter;
        vec2 suv = uv + vec2(cos(theta), sin(theta)) * (r * radius);
        float edgeMask = smoothstep(0.02, 0.065, suv.x) * smoothstep(0.98, 0.935, suv.x)
                       * smoothstep(0.02, 0.065, suv.y) * smoothstep(0.98, 0.935, suv.y);
        float w = 1.0 - 0.50 * r * r;
        acc += texture2D(tex, clamp(suv, 0.0, 1.0)).a * edgeMask * w;
        wSum += w;
      }
      return acc / max(wSum, 0.001);
    }

    vec3 sampleRainGlass(vec2 ruv, float blurR) {
      float activeGlass = clamp(max(u_rainParams.x, u_weatherFx.y), 0.0, 1.0);
      if (activeGlass <= 0.005) return vec3(0.0);
      float inB = smoothstep(0.006, 0.025, ruv.x) * smoothstep(0.994, 0.975, ruv.x)
                * smoothstep(0.006, 0.025, ruv.y) * smoothstep(0.994, 0.975, ruv.y);
      if (inB <= 0.001) return vec3(0.0);

      float isSnow = step(u_rainParams.x + 0.01, u_weatherFx.y);
      float b = mix(clamp(blurR, 0.00042, 0.0024), clamp(blurR * 0.38, 0.00022, 0.00090), isSnow);
      vec3 c0 = texture2D(u_texRain, clamp(ruv, 0.0, 1.0)).rgb;
      vec3 c1 = texture2D(u_texRain, clamp(ruv + vec2( b,  b * 0.7), 0.0, 1.0)).rgb;
      vec3 c2 = texture2D(u_texRain, clamp(ruv + vec2(-b,  b * 0.7), 0.0, 1.0)).rgb;
      vec3 c3 = texture2D(u_texRain, clamp(ruv + vec2( b * 0.7, -b), 0.0, 1.0)).rgb;
      vec3 c4 = texture2D(u_texRain, clamp(ruv + vec2(-b * 0.7, -b), 0.0, 1.0)).rgb;
      return (c0 * 0.36 + (c1 + c2 + c3 + c4) * 0.16) * inB * activeGlass;
    }

    float evalRainStreakLayer(vec2 p, float tilt, vec2 cellScale, float fallSpeed, float density, float seedOff) {
      vec2 q = vec2(p.x + p.y * tilt, p.y);
      q.x *= cellScale.x;
      float colId = floor(q.x);
      float colRnd1 = hash12(vec2(colId + seedOff, 19.37));
      float colRnd2 = hash12(vec2(colId + seedOff * 1.7, 73.11));

      float vCol = fallSpeed * (0.80 + 0.42 * colRnd1);
      float yCoord = (q.y + u_time * vCol) * cellScale.y + colRnd2 * 17.3;

      vec2 cellId = vec2(colId, floor(yCoord));
      vec2 f = vec2(fract(q.x), fract(yCoord));

      float r1 = hash12(cellId + vec2(seedOff, 3.1));
      float r2 = hash12(cellId + vec2(seedOff + 11.7, 27.4));
      float r3 = hash12(cellId + vec2(seedOff + 43.2, 61.9));
      if (r1 < 1.0 - clamp(density, 0.08, 0.72)) return 0.0;

      float cx = 0.20 + 0.60 * r2;
      float halfW = mix(0.055, 0.095, r3);
      float dxS = (f.x - cx) / halfW;
      float wx = exp(-dxS * dxS);

      float len = mix(0.46, 0.82, r2);
      float y0 = (1.0 - len) * r3;
      float y1 = y0 + len;
      float wy = smoothstep(y0, y0 + 0.14 * len, f.y) * smoothstep(y1, y1 - 0.24 * len, f.y);
      float osc = 0.76 + 0.24 * sin(f.y * 24.0 + r3 * 6.28318);
      return wx * wy * osc * (0.55 + 0.45 * r1);
    }

    float evalOutdoorFallingRain(float zW, float yW, float r, float s) {
      float rainAmt = u_rainParams.x;
      if (rainAmt <= 0.008) return 0.0;
      float rainInt = u_rainParams.y;
      float thunderAmt = u_weatherFx.x;
      float tilt = clamp(u_windMs / 5.2, -1.65, 1.65);
      float windNorm = clamp(abs(u_windMs) / 10.0, 0.0, 1.0);
      float sideSign = u_winSide > 0.0 ? -1.0 : 1.0;
      float rainDensCurve = pow(clamp(rainInt, 0.25, 1.35), 1.28);
      float stormBoost = (1.0 + thunderAmt * 0.28) * (1.0 + windNorm * 0.36);
      float speedBoost = (1.0 + thunderAmt * 0.16) * (1.0 + windNorm * 0.44);

      float dR1 = 0.20 * u_W;
      vec2 p1 = vec2(sideSign * (zW + dR1 / r) / u_W, (yW + dR1 * s) / u_W);
      float s1 = evalRainStreakLayer(p1, tilt, vec2(62.0, 2.5), 4.6 * speedBoost, 0.34 * rainDensCurve * stormBoost, 11.3);

      float dR2 = 0.62 * u_W;
      vec2 p2 = vec2(sideSign * (zW + dR2 / r) / u_W, (yW + dR2 * s) / u_W);
      float s2 = evalRainStreakLayer(p2, tilt * 0.92, vec2(96.0, 3.4), 3.7 * speedBoost, 0.46 * rainDensCurve * stormBoost, 57.9);
      return clamp((s1 * 0.68 + s2 * 0.46) * rainAmt, 0.0, 1.0);
    }

    float interval1D(float x, float lo, float hi, float pen) {
      if (hi <= lo) return 0.0;
      float halfW = 0.5 * (hi - lo);
      float mid = 0.5 * (lo + hi);
      return smoothstep(pen, -pen, abs(x - mid) - halfW);
    }

    float sdBox2(vec2 q, vec2 b) {
      vec2 d = abs(q) - b;
      return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
    }

    float sdSegment2(vec2 q, vec2 a, vec2 b) {
      vec2 qa = q - a, ba = b - a;
      float h = clamp(dot(qa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
      return length(qa - ba * h);
    }

    float evalArchOuter2D(vec2 p, float asp, float mode) {
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION == 0 || ACTIVE_MULLION == 1
      if (mode < 1.5) {
        return sdBox2(p, vec2(1.0, asp));
      }
      #endif
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION == 2
      if (mode < 2.5) {
        float archW = min(1.0, 0.82 * asp);
        float ySpring = asp - archW;
        float qx = abs(p.x);
        return (p.y >= ySpring)
          ? (length(vec2(qx, p.y - ySpring)) - archW)
          : max(qx - archW, -(p.y + asp));
      }
      #endif
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION == 3
      if (mode < 3.5) {
        float archW = min(1.0, 0.76 * asp);
        float k = 1.45 * archW;
        float cOff = k - archW;
        float hArch = sqrt(k * k - cOff * cOff);
        float ySpring = asp - hArch;
        float qx = abs(p.x);
        return (p.y >= ySpring)
          ? (length(vec2(qx + cOff, p.y - ySpring)) - k)
          : max(qx - archW, -(p.y + asp));
      }
      #endif
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION == 4
      if (mode < 4.5) {
        float archW = min(1.0, 0.80 * asp);
        float jambW = 0.78 * archW;
        float yArchC = asp - archW;
        float qx = abs(p.x);
        float dCirc = length(vec2(qx, p.y - yArchC)) - archW;
        float dDoor = sdBox2(vec2(qx, p.y - 0.5 * (yArchC - asp)), vec2(jambW, 0.5 * (yArchC + asp)));
        return min(dCirc, dDoor);
      }
      #endif
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION == 5
      {
        float cW = min(0.50, 0.44 * asp);
        float ySpring = asp - cW;
        float ySideTop = ySpring - 0.044;
        float qx = abs(p.x);
        float dCenter = (p.y >= ySpring)
          ? (length(vec2(qx, p.y - ySpring)) - cW)
          : max(qx - cW, -(p.y + asp));
        float dSides = sdBox2(vec2(qx, p.y - 0.5 * (ySideTop - asp)), vec2(1.0, 0.5 * (ySideTop + asp)));
        return min(dCenter, dSides);
      }
      #endif
      return 1.0;
    }

    float evalArchSolid2D(vec2 p, float asp, float mode) {
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION == 0
      if (mode < 0.5) {
        vec2 q = abs(p);
        float s = min(1.0, asp);
        float t = 0.021 * s;
        float rMoon = 0.48 * s;
        float dRing = abs(length(p) - rMoon) - (0.024 * s);
        float dCrossH = max(q.y - t, (rMoon - 0.008 * s) - length(p));
        float dCrossV = max(q.x - t, (rMoon - 0.008 * s) - length(p));
        float bx = 1.0 - 0.16 * s, by = asp - 0.16 * s;
        float cx = 1.0 - 0.34 * s, cy = asp - 0.34 * s;
        float dF1 = sdSegment2(q, vec2(bx, 0.0), vec2(bx, cy)) - t;
        float dF2 = sdSegment2(q, vec2(cx, cy), vec2(1.06, cy)) - t;
        float dF3 = sdSegment2(q, vec2(cx, cy), vec2(cx, asp + 0.06)) - t;
        float dF4 = sdSegment2(q, vec2(0.0, by), vec2(cx, by)) - t;
        return min(min(dRing, min(dCrossH, dCrossV)), min(min(dF1, dF2), min(dF3, dF4)));
      }
      #endif
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION == 1
      if (mode < 1.5) {
        float qx = abs(p.x), s = min(1.0, asp);
        float pRail = -0.22 * asp;
        float tK = 0.0165 * s;
        float dRail = abs(p.y - pRail) - (0.024 * s);
        float dV0 = sdSegment2(vec2(qx, p.y), vec2(0.0, pRail), vec2(0.0, asp + 0.06)) - (0.020 * s);
        float dV1 = sdSegment2(vec2(qx, p.y), vec2(0.50, pRail), vec2(0.50, asp + 0.06)) - tK;
        float dH1 = abs(p.y - mix(pRail, asp, 0.3333)) - tK;
        float dH2 = abs(p.y - mix(pRail, asp, 0.6667)) - tK;
        return min(dRail, min(min(dV0, dV1), min(dH1, dH2)));
      }
      #endif
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION == 2
      if (mode < 2.5) {
        float archW = min(1.0, 0.82 * asp);
        float ySpring = asp - archW;
        float qx = abs(p.x);
        float t = 0.019 * archW, tMain = 0.026 * archW;
        vec2 pf = vec2(qx, p.y - ySpring);
        float rHub = 0.29 * archW;
        float dTrans = sdSegment2(vec2(qx, p.y), vec2(0.0, ySpring), vec2(archW + 0.06, ySpring)) - tMain;
        float dHub = max(abs(length(pf) - rHub) - t, (ySpring - tMain * 0.25) - p.y);
        float rIn = rHub * 0.94, rOut = archW + 0.06;
        float dSpoke90 = sdSegment2(pf, vec2(0.0, rIn), vec2(0.0, rOut)) - t;
        float dSpoke60 = sdSegment2(pf, vec2(0.500000, 0.866025) * rIn, vec2(0.500000, 0.866025) * rOut) - t;
        float dSpoke30 = sdSegment2(pf, vec2(0.866025, 0.500000) * rIn, vec2(0.866025, 0.500000) * rOut) - t;
        float dStile = sdSegment2(vec2(qx, p.y), vec2(0.0, -asp - 0.06), vec2(0.0, ySpring)) - tMain;
        float dBar1 = abs(p.y - mix(-asp, ySpring, 0.3333)) - t;
        float dBar2 = abs(p.y - mix(-asp, ySpring, 0.6667)) - t;
        return min(min(dTrans, dHub), min(min(dSpoke90, min(dSpoke60, dSpoke30)), min(dStile, min(dBar1, dBar2))));
      }
      #endif
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION == 3
      if (mode < 3.5) {
        float archW = min(1.0, 0.76 * asp);
        float k = 1.45 * archW;
        float cOff = k - archW;
        float hArch = sqrt(k * k - cOff * cOff);
        float ySpring = asp - hArch;
        float qx = abs(p.x);
        float t = 0.022 * archW, tMain = 0.026 * archW;
        float yRose = ySpring + 0.62 * archW;
        float rRose = 0.30 * archW;
        float dRose = abs(length(vec2(qx, p.y - yRose)) - rRose) - tMain;
        float ySubSpring = ySpring - 0.20 * archW;
        float rSub = 0.725 * archW;
        float cSub = 0.225 * archW;
        float sx = abs(qx - 0.5 * archW);
        float dSubArch = max(abs(length(vec2(sx + cSub, p.y - ySubSpring)) - rSub) - t, (ySubSpring - t) - p.y);
        float dMull = sdSegment2(vec2(qx, p.y), vec2(0.0, -asp - 0.06), vec2(0.0, yRose - rRose + 0.01 * archW)) - tMain;
        float dLow = abs(p.y - mix(-asp, ySubSpring, 0.50)) - t;
        return min(min(dRose, dSubArch), min(dMull, dLow));
      }
      #endif
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION == 4
      if (mode < 4.5) {
        float archW = min(1.0, 0.80 * asp);
        float jambW = 0.78 * archW;
        float yArchC = asp - archW;
        float yPinch = yArchC - sqrt(archW * archW - jambW * jambW);
        float qx = abs(p.x);
        float t = 0.022 * archW, tMain = 0.025 * archW;
        vec2 pc = vec2(p.x, p.y - yArchC);
        vec2 pc45 = 0.70710678 * vec2(pc.x + pc.y, pc.y - pc.x);
        float starR = 0.44 * archW;
        float dStar = abs(min(sdBox2(pc, vec2(starR)), sdBox2(pc45, vec2(starR)))) - t;
        float dLinkH = sdSegment2(vec2(qx, abs(pc.y)), vec2(1.34 * starR, 0.0), vec2(archW + 0.06, 0.0)) - t;
        float dLinkTop = sdSegment2(vec2(qx, pc.y), vec2(0.0, 1.34 * starR), vec2(0.0, archW + 0.06)) - t;
        float dTrans = sdSegment2(vec2(qx, p.y), vec2(0.0, yPinch), vec2(jambW + 0.08, yPinch)) - tMain;
        float dMull = sdSegment2(vec2(qx, p.y), vec2(0.0, -asp - 0.06), vec2(0.0, yPinch)) - tMain;
        return min(min(dStar, dTrans), min(min(dLinkH, dLinkTop), dMull));
      }
      #endif
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION == 5
      {
        float cW = min(0.50, 0.44 * asp);
        float ySpring = asp - cW;
        float ySideTop = ySpring - 0.044;
        float qx = abs(p.x);
        float tPil = 0.032, tBar = 0.021, tArch = 0.017, tTrans = 0.024;
        float dPilaster = sdSegment2(vec2(qx, p.y), vec2(cW, -asp - 0.06), vec2(cW, ySpring + 0.015)) - tPil;
        float dTrans = sdSegment2(vec2(qx, p.y), vec2(0.0, ySpring), vec2(cW + tPil, ySpring)) - tTrans;
        vec2 pf = vec2(qx, p.y - ySpring);
        float rHub = 0.30 * cW;
        float dHub = max(abs(length(pf) - rHub) - tArch, (ySpring - tTrans * 0.25) - p.y);
        float rIn = rHub * 0.94, rOut = cW + 0.06;
        float dSpokeV = sdSegment2(pf, vec2(0.0, rIn), vec2(0.0, rOut)) - tArch;
        float dSpokeD = sdSegment2(pf, vec2(0.70710678) * rIn, vec2(0.70710678) * rOut) - tArch;
        float dMid = abs(p.y - 0.5 * (ySideTop - asp)) - tBar;
        return min(min(dPilaster, dTrans), min(min(dHub, min(dSpokeV, dSpokeD)), dMid));
      }
      #endif
      return 1.0;
    }

    float evalWindowApertureSimple(float zW, float yW, float z0, float z1, float y0, float y1, float mShiftZ, float mShiftY, vec2 p, float asp, float pPenZ, float pPenY, float penZ, float penY) {
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION == 6
      if (u_mullionMode < 6.5) {
        // Physically-based 3D tilted 50mm Venetian blinds:
        // 14 sunlit gaps (13 slats) with live solar profile angle u_s = tan(beta_p),
        // 18-deg slat tilt, top headrail & bottom weight rail, twin ladder cords, and exact anisotropic penumbra.
        float outerMask = interval1D(zW, z0, z1, penZ) * interval1D(yW, y0, y1, penY);
        float nBands = 14.0;
        float pitch = (2.0 * asp) / nBands;
        float railOpen = interval1D(p.y, -asp + 0.22 * pitch, asp - 0.40 * pitch, max(0.002, pPenY));
        float vn = (p.y + asp) / (2.0 * asp);
        float yCell = vn * nBands;
        float slatIdx = clamp(floor(yCell + 0.5), 1.0, nBands - 1.0);
        float distSlat = abs(yCell - slatIdx) * pitch;
        float hShadow = clamp(
          0.5 * (1.08 * pitch) * 0.951 * abs(u_s - 0.325) + 0.5 * (0.08 * pitch) * sqrt(1.0 + u_s * u_s),
          0.14 * pitch,
          0.37 * pitch
        );
        float slatOpen = smoothstep(-max(0.002, pPenY), max(0.002, pPenY), distSlat - hShadow);
        float cordOpen = smoothstep(-max(0.002, pPenZ), max(0.002, pPenZ), abs(abs(p.x) - 0.64) - 0.015);
        return outerMask * railOpen * slatOpen * cordOpen;
      }
      #endif
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION == 7
      if (u_mullionMode < 7.5) {
        // Original Open Window: clean unobstructed full-pane aperture
        return interval1D(zW, z0, z1, penZ) * interval1D(yW, y0, y1, penY);
      }
      #endif
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION == 8
      if (u_mullionMode < 8.5) {
        // Original Cross Window: classic 4-pane center mullion
        float zCenter = u_winRect.x, zWidth = u_winRect.y, yCenter = u_winRect.z, yHeight = u_winRect.w;
        float halfBarZ = 0.022 * zWidth + 0.5 * mShiftZ;
        float halfBarY = 0.015 * yHeight + 0.5 * mShiftY;
        float apZ = interval1D(zW, z0, zCenter - halfBarZ, penZ)
                  + interval1D(zW, zCenter + halfBarZ, z1, penZ);
        float apY = interval1D(yW, y0, yCenter - halfBarY, penY)
                  + interval1D(yW, yCenter + halfBarY, y1, penY);
        return clamp(apZ, 0.0, 1.0) * clamp(apY, 0.0, 1.0);
      }
      #endif
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION >= 9
      {
        // Original Grid Window: classic 6-pane mullion grid
        float zCenter = u_winRect.x, zWidth = u_winRect.y, yCenter = u_winRect.z, yHeight = u_winRect.w;
        float yMin = yCenter - yHeight * 0.5;
        float halfBarZ = 0.020 * zWidth + 0.5 * mShiftZ;
        float halfBarY = 0.012 * yHeight + 0.5 * mShiftY;
        float yBar1 = yMin + yHeight * 0.3333;
        float yBar2 = yMin + yHeight * 0.6667;
        float apZ = interval1D(zW, z0, zCenter - halfBarZ, penZ)
                  + interval1D(zW, zCenter + halfBarZ, z1, penZ);
        float apY = interval1D(yW, y0, yBar1 - halfBarY, penY)
                  + interval1D(yW, yBar1 + halfBarY, yBar2 - halfBarY, penY)
                  + interval1D(yW, yBar2 + halfBarY, y1, penY);
        return clamp(apZ, 0.0, 1.0) * clamp(apY, 0.0, 1.0);
      }
      #endif
      return 0.0;
    }

    float evalArchSolidSweep3(vec2 p, float asp, vec2 dp, float pPen) {
      float dpLen = length(dp);
      float sweepLen = min(dpLen, 0.065);
      float dCenter = evalArchSolid2D(p, asp, u_mullionMode);
      float dSolid3D = dCenter;
      if (dSolid3D > -pPen && dCenter < 0.40 * sweepLen + pPen && sweepLen > 0.002) {
        vec2 dpS = dp * (0.3333 * sweepLen / dpLen);
        float dM = evalArchSolid2D(p - dpS, asp, u_mullionMode);
        float dP = evalArchSolid2D(p + dpS, asp, u_mullionMode);
        dSolid3D = min(dSolid3D, min(dM, dP)) - 0.055 * sweepLen;
      }
      return dSolid3D;
    }

    float evalWindowApertureFast(float zW, float yW, float z0, float z1, float y0, float y1, float mShiftZ, float mShiftY, float penZ, float penY) {
      if (z1 <= z0 + 0.001 || y1 <= y0 + 0.001) return 0.0;
      float cZ = 0.5 * (z0 + z1), hZ = 0.5 * (z1 - z0);
      float cY = 0.5 * (y0 + y1), hY = 0.5 * (y1 - y0);
      float asp = hY / hZ;
      vec2 p = vec2((zW - cZ) / hZ, (yW - cY) / hZ);
      float pPenZ = penZ / hZ;
      float pPenY = penY / hZ;

      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION < 6
      if (u_mullionMode < 5.5) {
        float pPen = max(0.002, min(pPenZ, pPenY) * 0.65 + max(pPenZ, pPenY) * 0.35);
        float dOuter = evalArchOuter2D(p, asp, u_mullionMode);
        return smoothstep(pPen, -pPen, dOuter);
      }
      #endif
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION >= 6
      return evalWindowApertureSimple(zW, yW, z0, z1, y0, y1, mShiftZ, mShiftY, p, asp, pPenZ, pPenY, penZ, penY);
      #endif
      return 0.0;
    }

    vec3 evalWindowApertureRGB(float zW, float yW, vec2 dispVec, float z0, float z1, float y0, float y1, float mShiftZ, float mShiftY, float penZ, float penY) {
      if (z1 <= z0 + 0.001 || y1 <= y0 + 0.001) return vec3(0.0);
      float cZ = 0.5 * (z0 + z1), hZ = 0.5 * (z1 - z0);
      float cY = 0.5 * (y0 + y1), hY = 0.5 * (y1 - y0);
      float asp = hY / hZ;
      vec2 p = vec2((zW - cZ) / hZ, (yW - cY) / hZ);
      float pPenZ = penZ / hZ;
      float pPenY = penY / hZ;

      vec2 dispP = dispVec / hZ;
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION < 6
      if (u_mullionMode < 5.5) {
        float pPen = max(0.002, min(pPenZ, pPenY) * 0.65 + max(pPenZ, pPenY) * 0.35);
        float dOuterR = evalArchOuter2D(p - dispP, asp, u_mullionMode);
        float dOuterG = evalArchOuter2D(p,         asp, u_mullionMode);
        float dOuterB = evalArchOuter2D(p + dispP, asp, u_mullionMode);
        if (min(dOuterR, min(dOuterG, dOuterB)) >= pPen) return vec3(0.0);
        float dSolid3D = evalArchSolidSweep3(p, asp, vec2(mShiftZ / hZ, mShiftY / hZ), pPen);
        return vec3(
          smoothstep(pPen, -pPen, max(dOuterR, -dSolid3D)),
          smoothstep(pPen, -pPen, max(dOuterG, -dSolid3D)),
          smoothstep(pPen, -pPen, max(dOuterB, -dSolid3D))
        );
      }
      #endif
      #if !defined(ACTIVE_MULLION) || ACTIVE_MULLION >= 6
      return vec3(
        evalWindowApertureSimple(zW - dispVec.x, yW - dispVec.y, z0, z1, y0, y1, mShiftZ, mShiftY, p - dispP, asp, pPenZ, pPenY, penZ, penY),
        evalWindowApertureSimple(zW,             yW,             z0, z1, y0, y1, mShiftZ, mShiftY, p,         asp, pPenZ, pPenY, penZ, penY),
        evalWindowApertureSimple(zW + dispVec.x, yW + dispVec.y, z0, z1, y0, y1, mShiftZ, mShiftY, p + dispP, asp, pPenZ, pPenY, penZ, penY)
      );
      #endif
      return vec3(0.0);
    }

    float evalSparseDust(vec2 wallPos, float t) {
      if (u_dustOn < 0.5) return 0.0;
      float acc = 0.0;
      for (int i = 0; i < 9; i++) {
        float fi = float(i);
        vec2 seed = vec2(fi * 17.31 + 3.1, fi * 29.17 + 7.4);
        float rx = hash12(seed), ry = hash12(seed + 13.7), rs = hash12(seed + 41.3);
        float mx = (fract(rx + t * (0.0032 + 0.0022 * rs) * (-u_winSide) + sin(t * 0.14 + fi * 1.7) * 0.045) - 0.5) * 2.25 * u_halfSpanX;
        float my = (fract(ry + t * (0.0045 + 0.0030 * rx) + cos(t * 0.11 + fi * 2.3) * 0.035) - 0.5) * 1.75;
        float dist = length(wallPos - vec2(mx, my));
        float rad = mix(0.0045, 0.0105, rs);
        acc += smoothstep(rad, rad * 0.12, dist) * (0.48 + 0.52 * sin(t * (0.55 + 0.35 * rx) + fi * 4.1)) * mix(0.55, 1.0, rs);
      }
      return clamp(acc, 0.0, 1.0);
    }

    void trace3DWindowOptics(
      vec2 wallPos, float penMult, float edgeDissolveScale, float treeDissolveScale, float jitter,
      out vec3 directVisRGB, out float halationGlow, out float bounceGI, out float rainCaustic
    ) {
      directVisRGB = vec3(0.0); halationGlow = 0.0; bounceGI = 0.0; rainCaustic = 0.0;

      float rainAmt = u_rainParams.x;
      float thunderAmt = u_weatherFx.x;
      float snowAmt = u_weatherFx.y;
      float overcastAmt = clamp(max(rainAmt, snowAmt), 0.0, 1.0);
      float r = max(u_r, 0.20), s = max(u_s, 0.05);
      float dx = u_W - u_winSide * wallPos.x;
      float zW = dx / r;
      float yW = wallPos.y + dx * s;

      float zCenter = u_winRect.x, zWidth = u_winRect.y, yCenter = u_winRect.z, yHeight = u_winRect.w;
      float zMin = zCenter - zWidth * 0.5, zMax = zCenter + zWidth * 0.5;
      float yMin = yCenter - yHeight * 0.5, yMax = yCenter + yHeight * 0.5;

      float dIn = 0.052 * u_W;
      float dEx = 0.022 * u_W;
      float clipZIn = min(dIn / r, 0.16 * zWidth);
      float clipZEx = min(dEx / r, 0.07 * zWidth);
      float clipYIn = min(dIn * s, 0.13 * yHeight);
      float clipYEx = min(dEx * s, 0.06 * yHeight);

      float z0 = zMin + clipZIn;
      float z1 = zMax - clipZEx;
      float y0 = yMin + clipYIn;
      float y1 = yMax - clipYEx;

      if (snowAmt > 0.005) {
        float su = clamp((zW - z0) / max(z1 - z0, 0.01), 0.0, 1.0);
        float cornerDrift = 0.52 + 0.88 * pow(max(abs(su * 2.0 - 1.0), 0.0001), 1.85);
        float mound = 0.62 + 0.24 * sin(su * 9.4 + 0.7) + 0.14 * sin(su * 21.7 + 2.1);
        float sillSnow = yHeight * (0.020 + 0.032 * cornerDrift * mound) * snowAmt * clamp(u_weatherFx.z, 0.45, 1.32);
        y0 += sillSnow;
      }

      float mullDepth = 0.020 * u_W;
      float mShiftZ = min(mullDepth / r, 0.055 * zWidth);
      float mShiftY = min(mullDepth * s, 0.042 * yHeight);

      vec2 winUV = vec2((zW - zCenter) / zWidth + 0.5, (yW - yCenter) / yHeight + 0.5);
      vec2 screenWinUV = vec2(u_winSide > 0.0 ? (1.0 - winUV.x) : winUV.x, winUV.y);

      float hasGlass = 1.0 - 0.85 * step(6.5, u_mullionMode) * (1.0 - step(7.5, u_mullionMode));
      float gBroad = vnoise(winUV * vec2(3.2, 2.4) + vec2(2.1, 8.7));
      float gWave1 = vnoise(vec2(winUV.x * 13.5 + gBroad * 1.15, winUV.y * 2.35) + vec2(4.3, 1.9));
      float gWave2 = vnoise(vec2(winUV.x * 27.0 - gBroad * 0.85, winUV.y * 4.10) + vec2(11.4, 6.7));
      float grazingFactor = clamp((r - 0.55) * 0.85, 0.0, 1.0);
      float causticAmp = mix(0.032, 0.095, grazingFactor * (0.45 + 0.55 * max(u_sunsetHeat, u_dawnWarmth)))
                       * clamp(0.65 + 0.45 * dx, 0.65, 1.35)
                       * (1.0 - overcastAmt * 0.68) * (1.0 - u_isMoon * 0.45) * hasGlass;
      float linearRibbon = (gWave1 * 0.62 + gWave2 * 0.38) - 0.48;
      float glassMod = 1.0 + linearRibbon * causticAmp * 2.1;
      vec2 glassRefract = vec2((gWave1 - 0.5) * 1.35, (gBroad - 0.5) * 0.65) * (0.0045 + 0.0035 * grazingFactor) * hasGlass;

      float openCZ = 0.5 * (z0 + z1), openHZ = max(0.01, 0.5 * (z1 - z0));
      float openCY = 0.5 * (y0 + y1), openHY = max(0.01, 0.5 * (y1 - y0));
      float dZ = abs(zW - openCZ) - openHZ;
      float dY = abs(yW - openCY) - openHY;

      float weatherEdgeSoft = 1.0 + rainAmt * 0.45 + thunderAmt * 1.15 + snowAmt * 0.62;
      float rainNearTreeSoft = 1.0 + rainAmt * 1.05 + thunderAmt * 0.45 + snowAmt * 1.25;
      float rainFarTreeSoft  = 1.0 + rainAmt * 1.55 + thunderAmt * 0.55 + snowAmt * 1.72;
      float penWall = (0.010 + 0.011 * dx) * penMult * edgeDissolveScale * weatherEdgeSoft;
      float penZ = clamp(penWall / r, 0.008, mix(0.24, 0.36, thunderAmt) * zWidth);
      float penY = clamp(penWall * sqrt(1.0 + s * s), 0.008, mix(0.24, 0.36, thunderAmt) * yHeight);

      float dispAmt = (0.0020 + 0.0022 * grazingFactor * (0.5 + 0.5 * u_sunsetHeat))
                    * (1.0 - overcastAmt * 0.75) * (1.0 - u_isMoon * 0.72) * hasGlass;
      vec2 dispVec = normalize(vec2(1.0 / max(r, 0.25), s)) * dispAmt;
      vec3 winMaskRGB = evalWindowApertureRGB(zW, yW, dispVec, z0, z1, y0, y1, mShiftZ, mShiftY, penZ, penY);
      float maskG = winMaskRGB.g;

      float inOuter = smoothstep(penZ * 2.0, -penZ * 2.0, dZ) * smoothstep(penY * 2.0, -penY * 2.0, dY);
      float mullSoftOcc = inOuter * (1.0 - maskG);
      float revealDist = length(vec2(max(0.0, dZ) * r, max(0.0, dY)));
      float nearRevealBounce = exp(-revealDist * 6.8) * 0.24 * (1.0 - rainAmt * 0.45 + snowAmt * 0.16);
      float dzRev = (zW - (z0 - 0.17 * zWidth)) / max(0.085 * zWidth, 0.025);
      float revBandZ = exp(-dzRev * dzRev);
      float revBandY = interval1D(yW, y0 + 0.03 * yHeight, y1 - 0.03 * yHeight, penY * 2.6 + 0.045);
      float dySash = (yW - 0.5 * (y0 + y1)) / max(0.045 * yHeight, 0.015);
      float revSashBreak = 1.0 - 0.30 * exp(-dySash * dySash);
      float grazingReveal = smoothstep(0.82, 1.34, r) * (0.35 + 0.65 * max(u_sunsetHeat, u_dawnWarmth))
                          * (1.0 - overcastAmt * 0.80) * (1.0 - u_isMoon * 0.85);
      float revealSpecGlow = revBandZ * revBandY * revSashBreak * grazingReveal * 0.50;
      bounceGI = (exp(-revealDist * 2.15) + nearRevealBounce) * (1.0 - 0.28 * mullSoftOcc) + revealSpecGlow;

      float halPenZ = penZ * 2.9 + 0.034, halPenY = penY * 2.9 + 0.034;
      float halWin = smoothstep(halPenZ, -halPenZ * 0.45, dZ) * smoothstep(halPenY, -halPenY * 0.45, dY);
      if (halWin <= 0.001) return;

      float halAperture = evalWindowApertureFast(zW, yW, z0, z1, y0, y1, mShiftZ, mShiftY, halPenZ, halPenY);

      float dNear = u_treeDepths.x, dFar = u_treeDepths.y;
      float zTree1 = zW + dNear / r + glassRefract.x;
      float yTree1 = yW + dNear * s + glassRefract.y;
      float zTree2 = zW + dFar  / r + glassRefract.x * 0.8;
      float yTree2 = yW + dFar  * s + glassRefract.y * 0.8;

      float span1 = 1.30 * u_W, span2 = 1.72 * u_W;
      float u1Raw = (zTree1 - 1.52 * u_W) / span1 + 0.5;
      float v1    = (yTree1 - (yCenter + 0.34 * u_W)) / span1 + 0.5;
      float u2Raw = (zTree2 - 2.40 * u_W) / span2 + 0.5;
      float v2    = (yTree2 - (yCenter + 0.76 * u_W)) / span2 + 0.5;

      float u1 = u_winSide < 0.0 ? (0.985 - u1Raw * 0.95) : u1Raw;
      float u2 = u_winSide < 0.0 ? (0.975 - u2Raw * 0.95) : u2Raw;

      float rayLenScale = sqrt(1.0 + 1.0 / (r * r) + s * s);
      float rNear = 0.00145 * (dx + dNear) * rayLenScale * penMult * treeDissolveScale * rainNearTreeSoft;
      float rFar  = 0.00215 * (dx + dFar)  * rayLenScale * penMult * treeDissolveScale * rainFarTreeSoft;

      float occNear = sampleTreeVogel24(u_texNear, vec2(u1, v1), rNear, jitter);
      float occFar  = sampleTreeVogel24(u_texFar,  vec2(u2, v2), rFar,  jitter + 2.094);

      float edgeGrad = 0.0;
      if (dispAmt > 0.0005 && maskG > 0.01) {
        vec2 duv = vec2(0.0019, 0.0011);
        float sPlus  = texture2D(u_texNear, clamp(vec2(u1, v1) + duv, 0.0, 1.0)).a;
        float sMinus = texture2D(u_texNear, clamp(vec2(u1, v1) - duv, 0.0, 1.0)).a;
        edgeGrad = (sPlus - sMinus) * 0.042 * (1.0 - overcastAmt) * (1.0 - u_isMoon * 0.5);
      }

      float treeStrength = mix(0.88, 0.54, rainAmt) * mix(1.0, 0.62, snowAmt) * mix(1.0, 0.66, u_isMoon);
      float treeOcc = 1.0 - (1.0 - occNear * 0.88) * (1.0 - occFar * 0.52);

      float birdDistScale = clamp(0.56 + 0.34 * (dx / max(u_W, 0.5)), 0.55, 1.58);
      float birdRayScale = mix(1.0, clamp(rayLenScale * 0.56, 0.78, 1.38), 0.32);
      float penFactor = (0.72 + 0.28 * penMult) * (1.0 + overcastAmt * 0.45) * birdDistScale * birdRayScale;
      float b0 = sampleBirdSlot12(wallPos, u_bird0, u_birdBlur.x * penFactor, 0.0, jitter + 4.188);
      float b1 = sampleBirdSlot12(wallPos, u_bird1, u_birdBlur.y * penFactor, 0.5, jitter + 1.047);
      float birdOcc = clamp(max(b0, b1) * mix(0.76, 0.45, overcastAmt), 0.0, 0.80);

      float glassBlur = (0.00044 + 0.00040 * dx) * (0.72 + 0.28 * penMult);
      vec3 rainGlass = sampleRainGlass(screenWinUV, glassBlur);
      float rainGlassShadow = clamp(rainGlass.g * 0.46 + rainGlass.b * 0.18, 0.0, 0.56) * rainAmt;
      float snowAirShadow   = clamp(rainGlass.g * mix(0.62, 0.50, u_isMoon), 0.0, 0.48) * snowAmt;
      float snowLedgeShadow = clamp(rainGlass.b * 0.48, 0.0, 0.40) * snowAmt;
      float snowGlassShadow = clamp(1.0 - (1.0 - snowAirShadow) * (1.0 - snowLedgeShadow), 0.0, 0.68);
      float glassShadow = clamp(rainGlassShadow + snowGlassShadow, 0.0, 0.76);

      float outdoorStreaks = evalOutdoorFallingRain(zW, yW, r, s);
      float windRainVis = clamp(abs(u_windMs) / 8.0, 0.0, 1.0);
      float streakShadow = outdoorStreaks * (0.18 + 0.06 * thunderAmt + 0.08 * windRainVis);

      float causticFocus = mix(1.0, 0.86 + 0.28 * u_sunsetHeat + 0.18 * u_isMoon + 0.14 * thunderAmt, rainAmt);
      float rainRawCaustic = (rainGlass.r * 1.42 + rainGlass.b * 0.20 + outdoorStreaks * 0.14) * causticFocus * rainAmt;
      float snowGlint = (rainGlass.r * mix(0.14, 0.30, u_isMoon) + rainGlass.b * 0.14) * snowAmt;
      rainCaustic = (rainRawCaustic + snowGlint) * maskG * (1.0 - treeOcc * 0.38);

      float totalOcc = 1.0
        - (1.0 - treeOcc * treeStrength)
        * (1.0 - birdOcc)
        * (1.0 - glassShadow)
        * (1.0 - streakShadow);

      float leafSubsurface = occNear * (1.0 - occNear) * 4.0 * (1.0 - u_isMoon) * (1.0 - overcastAmt * 0.72);
      vec3 leafTransTint = vec3(0.032, 0.018, -0.022) * leafSubsurface * mix(1.0, 1.35, u_sunsetHeat);
      vec3 transRGB = clamp(vec3(1.0 - totalOcc) + vec3(edgeGrad, 0.0, -edgeGrad) + leafTransTint, 0.0, 1.0);
      directVisRGB = winMaskRGB * transRGB * glassMod;

      float treeHal = 1.0 - (1.0 - occNear * 0.45) * (1.0 - occFar * 0.22);
      halationGlow = halAperture * (1.0 - treeHal * 0.52) * (1.0 - rainAmt * 0.35 - snowAmt * 0.20);
    }

    void traceLightningFlash(vec2 wallPos, float jitter, out float flashVis, out float flashBounce, out float flashCaustic) {
      flashVis = 0.0; flashBounce = 0.0; flashCaustic = 0.0;
      float flashSharp = clamp(u_lightning.y, 0.0, 1.0);
      float r = clamp(u_r + u_lightning.z, 0.36, 1.68);
      float s = clamp(u_s + u_lightning.w, 0.16, 1.08);
      float dx = u_W - u_winSide * wallPos.x;
      float zW = dx / r;
      float yW = wallPos.y + dx * s;

      float zCenter = u_winRect.x, zWidth = u_winRect.y, yCenter = u_winRect.z, yHeight = u_winRect.w;
      float zMin = zCenter - zWidth * 0.5, zMax = zCenter + zWidth * 0.5;
      float yMin = yCenter - yHeight * 0.5, yMax = yCenter + yHeight * 0.5;

      float dIn = 0.052 * u_W, dEx = 0.022 * u_W;
      float z0 = zMin + min(dIn / r, 0.16 * zWidth);
      float z1 = zMax - min(dEx / r, 0.07 * zWidth);
      float y0 = yMin + min(dIn * s, 0.13 * yHeight);
      float y1 = yMax - min(dEx * s, 0.06 * yHeight);

      float mullDepth = 0.020 * u_W;
      float mShiftZ = min(mullDepth / r, 0.055 * zWidth);
      float mShiftY = min(mullDepth * s, 0.042 * yHeight);

      float openCZ = 0.5 * (z0 + z1), openHZ = max(0.01, 0.5 * (z1 - z0));
      float openCY = 0.5 * (y0 + y1), openHY = max(0.01, 0.5 * (y1 - y0));
      float dZ = abs(zW - openCZ) - openHZ;
      float dY = abs(yW - openCY) - openHY;

      float penScale = mix(2.75, 1.35, flashSharp);
      float penWall = (0.014 + 0.015 * dx) * penScale;
      float penZ = clamp(penWall / r, 0.014, 0.38 * zWidth);
      float penY = clamp(penWall * sqrt(1.0 + s * s), 0.014, 0.38 * yHeight);

      float winMask = evalWindowApertureFast(zW, yW, z0, z1, y0, y1, mShiftZ, mShiftY, penZ, penY);
      float revealDist = length(vec2(max(0.0, dZ) * r, max(0.0, dY)));
      flashBounce = (0.58 * exp(-revealDist * 1.15) + 0.42 * exp(-revealDist * 2.45));

      if (winMask <= 0.002) return;

      vec2 winUV = vec2((zW - zCenter) / zWidth + 0.5, (yW - yCenter) / yHeight + 0.5);
      vec2 screenWinUV = vec2(u_winSide > 0.0 ? (1.0 - winUV.x) : winUV.x, winUV.y);

      float dNear = u_treeDepths.x;
      float zTree1 = zW + dNear / r;
      float yTree1 = yW + dNear * s;
      float span1 = 1.30 * u_W;
      float u1Raw = (zTree1 - 1.52 * u_W) / span1 + 0.5;
      float v1    = (yTree1 - (yCenter + 0.34 * u_W)) / span1 + 0.5;
      float u1 = u_winSide < 0.0 ? (0.985 - u1Raw * 0.95) : u1Raw;

      float rayLenScale = sqrt(1.0 + 1.0 / (r * r) + s * s);
      float rNear = 0.0014 * (dx + dNear) * rayLenScale * mix(2.15, 0.95, flashSharp);
      float occNear = sampleTreeVogel12(u_texNear, vec2(u1, v1), rNear, jitter + 1.57);

      vec3 rainGlass = sampleRainGlass(screenWinUV, (0.00040 + 0.00036 * dx) * mix(1.35, 0.65, flashSharp));
      float glassShadow = clamp(rainGlass.g * 0.56 + rainGlass.b * 0.18, 0.0, 0.62);
      float streaks = evalOutdoorFallingRain(zW, yW, r, s);

      float occ = 1.0 - (1.0 - occNear * mix(0.42, 0.80, flashSharp)) * (1.0 - glassShadow) * (1.0 - streaks * 0.19);
      flashVis = winMask * (1.0 - occ);
      flashCaustic = (rainGlass.r * 1.52 + streaks * 0.30) * winMask * (1.0 - occNear * 0.45);
    }

    vec3 filmicToneMap(vec3 col, float satBoost) {
      const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
      vec3 aces = clamp((col * (a * col + b)) / (col * (c * col + d) + e), 0.0, 1.0);
      float lumaIn = dot(col, vec3(0.2126, 0.7152, 0.0722));
      float lumaMap = (lumaIn * (a * lumaIn + b)) / (lumaIn * (c * lumaIn + d) + e);
      vec3 chromaKept = clamp(col * (lumaMap / max(lumaIn, 0.0001)), 0.0, 1.0);
      vec3 outCol = mix(aces, chromaKept, clamp(0.32 + 0.38 * satBoost, 0.18, 0.74));
      float lumaOut = dot(outCol, vec3(0.2126, 0.7152, 0.0722));
      return clamp(mix(vec3(lumaOut), outCol, 1.0 + 0.19 * satBoost), 0.0, 1.0);
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution.xy;
      float aspect = u_resolution.x / max(u_resolution.y, 1.0);
      float narrowZoom = aspect < 1.0 ? (1.0 / max(aspect, 0.45)) : 1.0;
      vec2 wallPos = vec2((uv.x - 0.5) * 2.0 * aspect, (uv.y - 0.5) * 2.0) * narrowZoom;

      float rainAmt = u_rainParams.x;
      float thunderAmt = u_weatherFx.x;
      float snowAmt = u_weatherFx.y;
      float overcastAmt = clamp(max(rainAmt, snowAmt), 0.0, 1.0);
      vec3 L = normalize(vec3(u_winSide * u_r, u_r * u_s, 1.0));

      float hVal = 0.0, tonalVar = 1.0;
      vec3 N = computeWallNormal(wallPos, hVal, tonalVar);
      float jitter = hash12(gl_FragCoord.xy) * 6.2831853;

      float fade = clamp(u_beamFade, 0.0, 1.0);
      float fadeSafe = max(fade, 0.0001);
      float directFade = fade > 0.0001 ? pow(fadeSafe, mix(1.14, 1.24, u_isMoon)) : 0.0;
      float edgeDissolveScale = mix(2.15 + 1.15 * u_dawnWarmth, 1.0, fade > 0.0001 ? pow(fadeSafe, 0.72) : 0.0);
      float treeDissolveScale = mix(1.42, 1.0, fade > 0.0001 ? pow(fadeSafe, 0.75) : 0.0);

      vec3 beamVisRGB = vec3(0.0);
      float halation = 0.0, bounceGI = 0.0, rainCaustic = 0.0;

      if (fade > 0.001) {
        float solarAirSoft = mix(0.94, 1.06, clamp((u_r - 0.62) / 0.84, 0.0, 1.0));
        float beamPenMult = u_penScale * mix(solarAirSoft + 0.32 * u_sunsetHeat + 0.28 * u_dawnWarmth, 1.24, u_isMoon);
        trace3DWindowOptics(wallPos, beamPenMult, edgeDissolveScale, treeDissolveScale, jitter,
                            beamVisRGB, halation, bounceGI, rainCaustic);
      }

      float flatL = max(L.z, 0.18);
      float reliefDelta = (max(dot(N, L), 0.0) - flatL) / flatL;
      float grazingScale = mix(0.94 + 0.40 * u_sunsetHeat + 0.16 * u_dawnWarmth, 0.56, u_isMoon) * (1.0 - overcastAmt * 0.40);
      float directRelief = 1.0 + clamp(reliefDelta * u_wallTex * grazingScale, -0.23, 0.27);
      float ambRelief = 1.0 + clamp(reliefDelta * u_wallTex * 0.12 * fade, -0.025, 0.025);
      float microAO = mix(1.0, 0.976 + 0.036 * hVal, u_wallTex * 0.52);

      float normX = wallPos.x / max(u_halfSpanX, 0.5);
      float rightSweep = smoothstep(-1.08, 1.08, normX);
      float leftSweep  = 1.0 - rightSweep;
      float ceilingAO  = 1.0 - 0.048 * smoothstep(0.42, 1.05, wallPos.y);
      float vertRoom   = mix(0.86, 1.04, smoothstep(-1.05, 0.85, wallPos.y)) * ceilingAO;
      float activeEdgeSweep = u_winSide > 0.0 ? rightSweep : leftSweep;
      float hY = (wallPos.y + 0.04) * 1.45;
      float horizonBand = exp(-hY * hY) * activeEdgeSweep * activeEdgeSweep;

      vec3 ambientLight = (
        u_ambientCol * mix(0.86, 1.04, 0.5 + 0.5 * abs(normX))
        + u_leftGlowCol  * pow(max(leftSweep,  0.0001), 1.65)
        + u_rightGlowCol * pow(max(rightSweep, 0.0001), 1.65)
        + u_horizonGlowCol * horizonBand
      ) * vertRoom * ambRelief;

      float giScale = mix(
        mix(0.11, 0.21, u_sunsetHeat) * (0.78 + 0.22 * u_sunsetDrama) + 0.125 * u_dawnWarmth,
        0.036, u_isMoon
      ) * (1.0 - rainAmt * 0.30 + snowAmt * 0.18);

      float floorBounceEnv = exp(-max(0.0, wallPos.y + 1.02) * 1.95) * fade * (1.0 - u_isMoon * 0.88) * (1.0 - rainAmt * 0.56) * (1.0 - snowAmt * 0.55);
      vec3 floorBounceCol = mix(mix(mix(vec3(1.0, 0.90, 0.76), vec3(1.0, 0.76, 0.46), u_dawnWarmth * 0.75), vec3(1.0, 0.66, 0.40), u_sunsetHeat), vec3(0.44, 0.56, 0.84), u_isMoon);
      vec3 floorBounceLight = floorBounceCol * ((0.038 + 0.026 * u_sunsetHeat + 0.018 * u_dawnWarmth) * u_beamPower * floorBounceEnv);

      float edgeBias = mix(0.5, activeEdgeSweep, smoothstep(0.0, 0.30, fade));
      float snowUpEnv = mix(0.35, 1.0, smoothstep(-0.75, 0.90, wallPos.y)) * (0.45 + 0.55 * pow(max(edgeBias, 0.0001), 1.25)) * snowAmt;
      vec3 snowUpCol = mix(mix(vec3(0.84, 0.91, 1.04), vec3(0.96, 0.88, 0.86), u_sunsetHeat * 0.55), vec3(0.62, 0.74, 1.02), u_isMoon);
      float snowBeamTerm = mix(0.036, mix(0.095, 0.032, u_isMoon), smoothstep(0.0, 0.30, fade)) * (0.45 + 0.55 * fade);
      vec3 snowBounceLight = snowUpCol * (snowUpEnv * snowBeamTerm);

      float duskVertGrad = clamp((wallPos.y + 0.65) / 1.45, 0.0, 1.0);
      vec3 sunsetSpec = mix(vec3(1.06, 0.85, 0.66), vec3(1.02, 1.18, 1.46), duskVertGrad);
      vec3 dawnSpec = mix(vec3(1.05, 0.90, 0.74), vec3(1.02, 1.08, 1.18), duskVertGrad);
      vec3 spectralGrad = mix(
        vec3(1.0),
        sunsetSpec,
        u_sunsetHeat * (1.0 - overcastAmt * 0.55) * (1.0 - u_isMoon)
      );
      spectralGrad = mix(
        spectralGrad,
        dawnSpec,
        u_dawnWarmth * 0.45 * (1.0 - overcastAmt * 0.55) * (1.0 - u_isMoon)
      );
      vec3 bounceLight  = u_beamColor * (giScale * bounceGI * u_beamPower * fade);
      vec3 directLight  = (u_beamColor * spectralGrad) * (u_beamPower * beamVisRGB * directRelief * directFade);
      vec3 glintCol = mix(u_beamColor * spectralGrad, mix(u_beamColor, vec3(0.90, 0.96, 1.08), 0.55), snowAmt);
      vec3 causticLight = glintCol * (rainCaustic * 0.78 * u_beamPower * directFade);

      vec3 lightningLight = vec3(0.0);
      float flashI = u_lightning.x;
      if (flashI > 0.0008) {
        float flashVis = 0.0, flashBounce = 0.0, flashCaustic = 0.0;
        traceLightningFlash(wallPos, jitter, flashVis, flashBounce, flashCaustic);
        vec3 flashCol = mix(vec3(0.72, 0.82, 1.18), vec3(0.84, 0.92, 1.26), u_lightning.y);
        float flashRoomGrad = (0.28 + 0.72 * pow(max(activeEdgeSweep, 0.0001), 1.35)) * vertRoom;
        float flashRel = 1.0 + clamp(reliefDelta * u_wallTex * 0.75, -0.18, 0.20);
        lightningLight = flashCol * flashI * (
          0.22 * flashRoomGrad
          + 0.36 * flashBounce
          + 0.68 * flashVis * flashRel
          + 0.52 * flashCaustic
        );
      }

      vec3 wallAlbedo = u_wallMat < 0.5 ? vec3(0.688, 0.638, 0.582)
                      : (u_wallMat < 1.5 ? vec3(0.642, 0.616, 0.584) : vec3(0.715, 0.678, 0.625));

      vec3 color = wallAlbedo * tonalVar * (ambientLight + bounceLight + floorBounceLight + snowBounceLight + directLight + causticLight + lightningLight) * microAO;

      float sunLumaMask = beamVisRGB.g * directFade * (1.0 - u_isMoon) * (1.0 - overcastAmt * 0.92);
      if (sunLumaMask > 0.08 && u_dustOn > 0.5) {
        float dust = evalSparseDust(wallPos, u_time);
        vec3 dustTint = mix(vec3(1.0, 0.94, 0.82), vec3(1.0, 0.72, 0.38), u_sunsetHeat);
        color += dustTint * dust * smoothstep(0.08, 0.55, sunLumaMask) * (0.14 + 0.16 * u_sunsetHeat);
      }

      vec3 halTint = mix(
        mix(mix(vec3(1.0, 0.74, 0.40), vec3(1.0, 0.48, 0.18), u_sunsetHeat), vec3(1.0, 0.70, 0.42), u_dawnWarmth),
        vec3(0.48, 0.62, 0.96),
        u_isMoon
      );
      float halStrength = mix(
        (0.036 + 0.220 * u_sunsetHeat * u_sunsetDrama + 0.155 * u_dawnWarmth),
        0.012,
        u_isMoon
      ) * directFade * (1.0 - rainAmt * 0.44 - snowAmt * 0.28);
      color += halTint * (halation > 0.0001 ? pow(max(halation, 0.0001), 1.35) : 0.0) * halStrength;

      float innerLift = mix(0.046 + 0.076 * u_sunsetHeat + 0.056 * u_dawnWarmth, 0.010, u_isMoon) * (1.0 - rainAmt * 0.52 - snowAmt * 0.30);
      vec3 coreLiftCol = mix(u_beamColor, vec3(1.0, 0.84, 0.52) * max(u_beamColor.r, 1.0), 0.40 * u_sunsetHeat * (1.0 - u_isMoon));
      coreLiftCol = mix(coreLiftCol, vec3(1.0, 0.84, 0.50) * max(u_beamColor.r, 1.0), 0.32 * u_dawnWarmth * (1.0 - u_isMoon));
      color += coreLiftCol * (beamVisRGB.g * beamVisRGB.g) * innerLift * directFade;

      float satBoost = (u_sunsetHeat * u_sunsetDrama + 0.58 * u_dawnWarmth) * (1.0 - u_isMoon) * (1.0 - overcastAmt * 0.30);
      color = filmicToneMap(max(color, vec3(0.0)) * (1.03 + 0.06 * satBoost), satBoost);
      color = pow(max(color, vec3(0.0)), vec3(1.0 / 2.2));

      vec2 vUv = uv - 0.5;
