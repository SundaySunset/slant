          const lead = this._makeBird(fromLeft, 0.0, null);
          this.slots[0] = lead;
          this.slots[1] = (Math.random() < 0.32) ? this._makeBird(fromLeft, 0.24 + Math.random() * 0.18, lead) : null;
          this.nextFlightIn = 28.0 + Math.random() * 24.0;
        }

        _evalPath(b, t, bounds, cel) {
          const mt = 1 - t, mt2 = mt * mt, t2 = t * t;
          const rx = mt2 * mt * b.rx0 + 3 * mt2 * t * b.rx1 + 3 * mt * t2 * b.rx2 + t2 * t * b.rx3;
          const ry = mt2 * mt * b.ry0 + 3 * mt2 * t * b.ry1 + 3 * mt * t2 * b.ry2 + t2 * t * b.ry3;
          const drx = 3 * mt2 * (b.rx1 - b.rx0) + 6 * mt * t * (b.rx2 - b.rx1) + 3 * t2 * (b.rx3 - b.rx2);
          const dry = 3 * mt2 * (b.ry1 - b.ry0) + 6 * mt * t * (b.ry2 - b.ry1) + 3 * t2 * (b.ry3 - b.ry2);
          const ddrx = 6 * mt * (b.rx2 - 2 * b.rx1 + b.rx0) + 6 * t * (b.rx3 - 2 * b.rx2 + b.rx1);
          const ddry = 6 * mt * (b.ry2 - 2 * b.ry1 + b.ry0) + 6 * t * (b.ry3 - 2 * b.ry2 + b.ry1);

          const hw = Math.max(0.35, bounds.halfW);
          const hh = Math.max(0.38, bounds.halfH);
          const lightSlope = cel ? (cel.winSide * clamp(cel.s, 0.12, 0.92) * 0.86) : 0.0;
          const dxFromWin = rx * hw;
          const wx = bounds.cx + dxFromWin;
          const wy = bounds.cy + dxFromWin * lightSlope + ry * hh;
          const vx = drx * hw;
          const vy = vx * lightSlope + dry * hh;
          const ax = ddrx * hw;
          const ay = ax * lightSlope + ddry * hh;
          const curvature = (vx * ay - vy * ax) / Math.pow(Math.max(0.001, vx * vx + vy * vy), 1.5);
          return { wx, wy, vx, vy, curvature };
        }

        _fillSmoothContour(ctx, pts) {
          const n = pts.length;
          if (n < 3) return;
          ctx.beginPath();
          const mx0 = (pts[n - 1].x + pts[0].x) * 0.5;
          const my0 = (pts[n - 1].y + pts[0].y) * 0.5;
          ctx.moveTo(mx0, my0);
          for (let i = 0; i < n; i++) {
            const curr = pts[i];
            const next = pts[(i + 1) % n];
            const mx = (curr.x + next.x) * 0.5;
            const my = (curr.y + next.y) * 0.5;
            ctx.quadraticCurveTo(curr.x, curr.y, mx, my);
          }
          ctx.closePath();
          ctx.fill();
        }

        _drawBirdInTile(ctx, slotIdx, b, u, headingAngle, curveBank) {
          const tileX = slotIdx * 256;
          const cx = tileX + 128;
          const cy = 128;
          const pxScale = 76;

          const glideMask = smootherstep(b.glideStart - 0.06, b.glideStart + 0.05, u)
                          * (1.0 - smootherstep(b.glideEnd - 0.05, b.glideEnd + 0.07, u));
          const flapEnv = 1.0 - glideMask;

          const psi = b.flapPhase - 0.16 * Math.sin(b.flapPhase);
          const upStroke = flapEnv * Math.pow(Math.max(0, Math.sin(psi - 0.20)), 1.35);

          const bank = clamp(glideMask * b.glideBank + curveBank * 0.28, -0.34, 0.34);
          const cosB = Math.cos(bank), sinB = Math.sin(bank);
          const cosV = Math.cos(b.viewTilt), sinV = Math.sin(b.viewTilt);
          const fx = Math.cos(headingAngle), fy = Math.sin(headingAngle);
          const dirSign = fx >= 0 ? 1.0 : -1.0;
          const ux = -fy * dirSign, uy = Math.abs(fx);

          const proj = (xb, yb, zb) => {
            const y1 = yb * cosB - zb * sinB;
            const z1 = yb * sinB + zb * cosB;
            const uLoc = xb + z1 * 0.18;
            const vLoc = y1 * cosV + z1 * sinV;
            const rx = uLoc * fx + vLoc * ux;
            const ry = uLoc * fy + vLoc * uy;
            return { x: cx + rx * pxScale, y: cy - ry * pxScale };
          };

          const isSwallow = b.species === 'swallow';
          const spanMax = isSwallow ? 1.18 : 1.08;

          const drawSmoothWing = (sgn) => {
            const stations = [0.0, 0.26, 0.54, 0.80, 1.0];
            const leBaseX = isSwallow ? [0.22, 0.24, 0.17, -0.05, -0.34] : [0.24, 0.27, 0.21, 0.02, -0.22];
            const teBaseX = isSwallow ? [-0.26, -0.22, -0.17, -0.21, -0.38] : [-0.30, -0.28, -0.24, -0.24, -0.28];

            const lePts = [];
            const tePts = [];

            for (let i = 0; i < stations.length; i++) {
              const s = stations[i];
              const localPhase = psi - 1.12 * s;
              const beatWave = Math.cos(localPhase);

              const glideZ = 0.16 * Math.sin(s * Math.PI * 0.82) - 0.14 * s * s;
              const flapZ  = (0.22 * s + 0.62 * s * s) * beatWave;
              const zb = flapEnv * flapZ + (1.0 - flapEnv) * glideZ;

              const hingeCos = Math.cos(clamp(zb * 0.72, -0.95, 0.95));
              const foldShrink = 1.0 - 0.26 * upStroke * Math.pow(s, 1.15);
              const yb = sgn * s * spanMax * mix(1.0, hingeCos, 0.55) * foldShrink;

              const sweepShift = flapEnv * (0.12 * Math.cos(psi - 0.4) * s - 0.24 * upStroke * Math.pow(s, 1.25))
                               - (1.0 - flapEnv) * (isSwallow ? 0.10 : 0.04) * s;

              const chordScale = 1.0 - 0.28 * upStroke * s;
              const xMid = (leBaseX[i] + teBaseX[i]) * 0.5 + sweepShift;
              const halfChord = Math.max(0.015, (leBaseX[i] - teBaseX[i]) * 0.5 * chordScale);

              const teTwistZ = flapEnv * (-0.06 * Math.sin(localPhase) * s);

              lePts.push(proj(xMid + halfChord, yb, zb + 0.01));
              tePts.push(proj(xMid - halfChord, yb, zb + teTwistZ));
            }

            const contour = [];
            for (let i = 0; i < lePts.length; i++) contour.push(lePts[i]);
            for (let i = tePts.length - 1; i >= 0; i--) contour.push(tePts[i]);
            this._fillSmoothContour(ctx, contour);
          };

          const drawBodyAndTail = () => {
            const wBody = isSwallow ? 0.115 : 0.145;
            const bodyContour = [
              proj(0.56,  0.0,    0.02),
              proj(0.42,  0.055,  0.04),
              proj(0.26,  0.075,  0.03),
              proj(0.06,  wBody,  0.02),
              proj(-0.18, wBody * 0.78, 0.01),
              proj(-0.36, 0.052,  0.0),
              proj(-0.36, -0.052, 0.0),
              proj(-0.18, -wBody * 0.78, 0.01),
              proj(0.06,  -wBody, 0.02),
              proj(0.26,  -0.075, 0.03),
              proj(0.42,  -0.055, 0.04)
            ];
            this._fillSmoothContour(ctx, bodyContour);

            const fanSpread = (isSwallow ? 0.17 : 0.22) * (1.0 + 0.38 * glideMask + Math.abs(bank) * 0.65);
            const tailLen = isSwallow ? 0.42 : 0.34;
            const pTR = proj(-0.30,  0.048, 0.0);
            const pTL = proj(-0.30, -0.048, 0.0);
            const pER = proj(-0.30 - tailLen,  fanSpread, -0.01);
            const pEL = proj(-0.30 - tailLen, -fanSpread, -0.01);

            ctx.beginPath();
            ctx.moveTo(pTR.x, pTR.y);
            ctx.lineTo(pER.x, pER.y);
            if (isSwallow) {
              const pFork = proj(-0.30 - tailLen * 0.56, 0.0, -0.01);
              ctx.lineTo(pFork.x, pFork.y);
            } else {
              const pArc = proj(-0.30 - tailLen * 1.14, 0.0, -0.01);
              ctx.quadraticCurveTo(pArc.x, pArc.y, pEL.x, pEL.y);
            }
            ctx.lineTo(pEL.x, pEL.y);
            ctx.lineTo(pTL.x, pTL.y);
            ctx.closePath();
            ctx.fill();
          };

          ctx.save();
          ctx.fillStyle = '#000000';
          drawSmoothWing(-1);
          drawBodyAndTail();
          drawSmoothWing(1);
          ctx.restore();
        }

        update(dt, enabled, canAutoSpawn, winBounds, cel) {
          if (!enabled) {
            if (this.wasActive || this.slots[0] || this.slots[1]) {
              this.slots[0] = null; this.slots[1] = null;
              this.rect0[3] = 0; this.rect1[3] = 0;
              this.ctx.clearRect(0, 0, 512, 256);
              this.wasActive = false;
              return true;
            }
            return false;
          }

          if (!this.slots[0] && !this.slots[1] && canAutoSpawn) {
            this.nextFlightIn -= dt;
            if (this.nextFlightIn <= 0) this.triggerNow();
          }

          if (!this.slots[0] && !this.slots[1]) {
            if (this.wasActive) {
              this.rect0[3] = 0; this.rect1[3] = 0;
              this.ctx.clearRect(0, 0, 512, 256);
              this.wasActive = false;
              return true;
            }
            return false;
          }

          this.ctx.clearRect(0, 0, 512, 256);
          const rects = [this.rect0, this.rect1];
          let anyActive = false;

          for (let s = 0; s < 2; s++) {
            const b = this.slots[s];
            const rect = rects[s];
            if (!b) { rect[3] = 0; continue; }

            b.age += dt;
            if (b.age < 0) { rect[3] = 0; anyActive = true; continue; }
            if (b.age >= b.duration) { this.slots[s] = null; rect[3] = 0; continue; }

            const rawU = b.age / b.duration;
            const u = clamp(rawU + 0.016 * Math.sin(rawU * Math.PI * 2), 0, 1);

            const inGlide = smootherstep(b.glideStart - 0.06, b.glideStart + 0.04, u)
                          * (1.0 - smootherstep(b.glideEnd - 0.04, b.glideEnd + 0.06, u));
            b.flapPhase += dt * Math.PI * 2 * b.flapFreq * (1.0 - 0.78 * inGlide);

            const kin = this._evalPath(b, u, winBounds, cel);
            const flapEnv = 1.0 - inGlide;
            const psi = b.flapPhase - 0.16 * Math.sin(b.flapPhase);
            const liftBob = flapEnv * (-0.012 * Math.sin(psi - 0.45));

            const heading = Math.atan2(kin.vy, kin.vx);
            this._drawBirdInTile(this.ctx, s, b, u, heading, kin.curvature);

            rect[0] = kin.wx;
            rect[1] = kin.wy + liftBob;
            rect[2] = b.wallBox;
            rect[3] = smootherstep(0.0, 0.08, u) * (1.0 - smootherstep(0.92, 1.0, u));
            this.blur[s] = b.blurWall;
            anyActive = true;
          }

          this.wasActive = anyActive;
          return true;
        }
      }

      class GlassRainEngine {
        constructor(size) {
          this.size = size;
          this.canvas = document.createElement('canvas');
          this.canvas.width = size; this.canvas.height = size;
          this.ctx = this.canvas.getContext('2d', { alpha: false });

          this.mistCanvas = document.createElement('canvas');
          this.mistCanvas.width = size; this.mistCanvas.height = size;
          this.mistCtx = this.mistCanvas.getContext('2d', { alpha: true });

          this.gridN = 64;
          this.affinityGrid = new Float32Array(this.gridN * this.gridN);
          this.wetGrid = new Float32Array(this.gridN * this.gridN);
          this._initAffinityGrid();

          this.drops = [];
          this.rivulets = [];
          this.pinchedBeads = [];
          this.snowFlecks = [];
          this.snowFlakes = [];
          this.snowTime = 0;
          this.spawnAccum = 0;
          this.mistAccum = 0;
          this.snowAccum = 0;
          this.activeMode = 'none';
          this.hasRenderedRain = false;

          this.flakeSprites = this._buildFlakeSprites();
          this.frostCanvas = document.createElement('canvas');
          this.frostCanvas.width = size; this.frostCanvas.height = size;
          this.frostCtx = this.frostCanvas.getContext('2d', { alpha: true });
          this._buildPerimeterFrost();

          this.ctx.fillStyle = '#000000';
          this.ctx.fillRect(0, 0, size, size);
        }

        _buildFlakeSprites() {
          const makeSprite = (dim, mode) => {
            const c = document.createElement('canvas');
            c.width = dim; c.height = dim;
            const gctx = c.getContext('2d');
            const half = dim * 0.5;
            if (mode === 'near') {
              const rng = createRng(73109);
              for (let k = 0; k < 5; k++) {
                const ang = (k / 5) * Math.PI * 2 + rng() * 0.55;
                const off = dim * (0.04 + rng() * 0.08);
                const cx = half + Math.cos(ang) * off;
                const cy = half + Math.sin(ang) * off;
                const rr = dim * (0.26 + rng() * 0.14);
                const gr = gctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
                gr.addColorStop(0.0, 'rgba(58, 232, 0, 0.78)');
                gr.addColorStop(0.48, 'rgba(34, 155, 0, 0.44)');
                gr.addColorStop(0.82, 'rgba(10, 56, 0, 0.12)');
                gr.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
                gctx.fillStyle = gr;
                gctx.beginPath(); gctx.arc(cx, cy, rr, 0, Math.PI * 2); gctx.fill();
              }
            } else if (mode === 'mid') {
              const gr = gctx.createRadialGradient(half, half, 0, half, half, half * 0.96);
              gr.addColorStop(0.0, 'rgba(36, 224, 0, 0.72)');
              gr.addColorStop(0.46, 'rgba(18, 146, 0, 0.38)');
              gr.addColorStop(0.80, 'rgba(4, 48, 0, 0.10)');
              gr.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
              gctx.fillStyle = gr;
              gctx.beginPath(); gctx.arc(half, half, half * 0.96, 0, Math.PI * 2); gctx.fill();
            } else {
              const gr = gctx.createRadialGradient(half, half, 0, half, half, half * 0.96);
              gr.addColorStop(0.0, 'rgba(16, 178, 0, 0.46)');
              gr.addColorStop(0.52, 'rgba(6, 92, 0, 0.20)');
              gr.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
              gctx.fillStyle = gr;
              gctx.beginPath(); gctx.arc(half, half, half * 0.96, 0, Math.PI * 2); gctx.fill();
            }
            return c;
          };
          return {
            near: makeSprite(96, 'near'),
            mid:  makeSprite(80, 'mid'),
            far:  makeSprite(64, 'far')
          };
        }

        _buildPerimeterFrost() {
          const S = this.size, fctx = this.frostCtx, rng = createRng(441923);
          fctx.clearRect(0, 0, S, S);
          const steps = 64;
          for (let i = 0; i <= steps; i++) {
            const u = i / steps;
            const x = u * S;
            const cornerBias = 0.55 + 0.95 * Math.pow(Math.abs(u * 2.0 - 1.0), 1.8);
            const wave = 0.72 + 0.28 * Math.sin(u * 13.4 + 0.8) + 0.16 * Math.sin(u * 29.1 + 2.2);
            const h = S * (0.011 + 0.016 * cornerBias * wave);
            const g = fctx.createRadialGradient(x, S + h * 0.15, h * 0.15, x, S - h * 0.10, h * 1.45);
            g.addColorStop(0.0, 'rgba(32, 0, 195, 0.54)');
            g.addColorStop(0.55, 'rgba(18, 0, 130, 0.28)');
            g.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
            fctx.fillStyle = g;
            fctx.beginPath(); fctx.arc(x, S - h * 0.10, h * 1.45, 0, Math.PI * 2); fctx.fill();
          }
          for (let i = 0; i < 240; i++) {
            const corner = Math.floor(rng() * 4);
            const cx0 = (corner & 1) ? S : 0;
            const cy0 = (corner & 2) ? S : 0;
            const dist = Math.pow(rng(), 2.3) * S * 0.14;
            const spread = Math.pow(rng(), 1.6) * S * 0.22;
            const x = cx0 === 0 ? dist + (rng() < 0.5 ? spread * 0.45 : 0) : S - dist - (rng() < 0.5 ? spread * 0.45 : 0);
            const y = cy0 === 0 ? dist + (rng() >= 0.5 ? spread * 0.45 : 0) : S - dist - (rng() >= 0.5 ? spread * 0.45 : 0);
            const r = 4 + rng() * 14;
            const alpha = (1.0 - clamp(dist / (S * 0.15), 0, 1)) * (0.06 + rng() * 0.10);
            const g = fctx.createRadialGradient(x, y, 0, x, y, r);
            g.addColorStop(0.0, `rgba(65, 0, 135, ${alpha.toFixed(3)})`);
            g.addColorStop(0.6, `rgba(28, 0, 88, ${(alpha * 0.5).toFixed(3)})`);
            g.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
            fctx.fillStyle = g;
            fctx.beginPath(); fctx.arc(x, y, r, 0, Math.PI * 2); fctx.fill();
          }
        }

        _initAffinityGrid() {
          const rng = createRng(918273), N = this.gridN;
          const raw = new Float32Array(N * N);
          for (let i = 0; i < N * N; i++) raw[i] = rng();
          for (let y = 0; y < N; y++) {
            for (let x = 0; x < N; x++) {
              let sum = 0, cnt = 0;
              for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                  sum += raw[clamp(y + dy, 0, N - 1) * N + clamp(x + dx, 0, N - 1)];
                  cnt++;
                }
              }
              this.affinityGrid[y * N + x] = sum / cnt;
            }
          }
        }

        _sampleGridGradX(xPx, yPx) {
          const N = this.gridN;
          const gx = clamp(Math.floor((xPx / this.size) * N), 1, N - 2);
          const gy = clamp(Math.floor((yPx / this.size) * N), 0, N - 1);
          const gyNext = Math.min(N - 1, gy + 1);
          const leftVal  = this.affinityGrid[gyNext * N + (gx - 1)] + this.wetGrid[gyNext * N + (gx - 1)] * 2.8;
          const rightVal = this.affinityGrid[gyNext * N + (gx + 1)] + this.wetGrid[gyNext * N + (gx + 1)] * 2.8;
          return { gradX: rightVal - leftVal, wetness: this.wetGrid[gy * N + gx] };
        }

        _depositWetness(xPx, yPx, amt) {
          const N = this.gridN;
          const idx = clamp(Math.floor((yPx / this.size) * N), 0, N - 1) * N + clamp(Math.floor((xPx / this.size) * N), 0, N - 1);
          this.wetGrid[idx] = Math.min(1.0, this.wetGrid[idx] + amt);
        }

        _condenseMistBead(x, y, r) {
          const mctx = this.mistCtx;
          const grad = mctx.createRadialGradient(x, y, r * 0.25, x, y, r * 1.15);
          grad.addColorStop(0.0, 'rgba(130, 0, 120, 0.55)');
          grad.addColorStop(0.65, 'rgba(30, 0, 210, 0.78)');
          grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
          mctx.fillStyle = grad;
          mctx.beginPath(); mctx.arc(x, y, r * 1.15, 0, Math.PI * 2); mctx.fill();
        }

        seedInitialRain() {
          this.drops = []; this.rivulets = []; this.pinchedBeads = []; this.wetGrid.fill(0);
          const S = this.size;
          this.mistCtx.clearRect(0, 0, S, S);
          for (let i = 0; i < 360; i++) this._condenseMistBead(Math.random() * S, Math.random() * S, 1.0 + Math.random() * 1.85);
          for (let i = 0; i < 48; i++) {
            const d = this._makeDrop(Math.random() * S, Math.random() * S * 0.92, 1.6 + Math.random() * 3.6);
            if (i < 10) {
              d.r = 3.8 + Math.random() * 1.8; d.sliding = true; d.vy = 60 + Math.random() * 90;
              const startY = Math.max(8, d.y - (60 + Math.random() * 120));
              let px = d.x;
              for (let py = startY; py <= d.y; py += 7) {
                px += (Math.random() - 0.5) * 2.2;
                d.trail.push({ x: px, y: py, w: d.r * 0.52, age: (d.y - py) * 0.015 });
                this._depositWetness(px, py, 0.45);
              }
              d.x = px;
            }
            this.drops.push(d);
          }
        }

        _makeSnowFlake(spawnAtTop = false) {
          const S = this.size;
          const z = Math.pow(Math.random(), 1.18);
          const sizeClass = clamp(Math.exp((Math.random() - 0.58) * 0.85), 0.36, 1.55);
          const vt = S * (0.072 + 0.088 * Math.pow(sizeClass, 0.55)) * (1.0 - 0.34 * z);
          return {
            x: (Math.random() * 1.32 - 0.16) * S,
            y: spawnAtTop ? (-0.04 - Math.random() * 0.14) * S : (Math.random() * 1.16 - 0.08) * S,
            z,
            sizeClass,
            vt,
            vx: 0,
            vy: vt,
            dragRate: 2.1 + (1.6 - sizeClass) * 1.1,
            flutterFreq: 1.35 + Math.random() * 1.65,
            flutterPhase: Math.random() * Math.PI * 2,
            flutterAmp: S * (0.022 + 0.028 * (1.15 - 0.35 * sizeClass)) * (1.0 - 0.25 * z),
            tumblePhase: Math.random() * Math.PI * 2,
            tumbleRate: (Math.random() < 0.5 ? -1 : 1) * (0.8 + Math.random() * 1.8)
          };
        }

        _sampleWindEddy(nx, ny, z, t, windMag) {
          const k1 = 3.2, k2 = 6.8;
          const a1 = 0.015 + 0.008 * windMag;
          const a2 = 0.007 + 0.004 * windMag;
          const p1x = k1 * nx - t * (0.48 + 0.18 * windMag) + z * 2.1;
          const p1y = k1 * ny - t * 0.32;
          const p2x = k2 * nx + t * 0.55 - z * 3.4;
          const p2y = k2 * ny + t * 0.44 + z * 1.7;

          const u1 = -a1 * k1 * Math.sin(p1x) * Math.sin(p1y);
          const v1 = -a1 * k1 * Math.cos(p1x) * Math.cos(p1y);
          const u2 =  a2 * k2 * Math.sin(p2x) * Math.cos(p2y);
          const v2 = -a2 * k2 * Math.cos(p2x) * Math.sin(p2y);
          return { ex: u1 + u2, ey: v1 + v2 };
        }

        seedInitialSnow() {
          this.snowFlakes = [];
          this.snowFlecks = [];
          this.snowTime = Math.random() * 100.0;
          for (let i = 0; i < 150; i++) this.snowFlakes.push(this._makeSnowFlake(false));
          const S = this.size;
          for (let i = 0; i < 12; i++) {
            this.snowFlecks.push({
              x: Math.random() * S, y: Math.random() * S,
              r: 1.0 + Math.random() * 1.6,
              age: Math.random() * 4.5,
              maxAge: 4.0 + Math.random() * 4.5
            });
          }
        }

        _makeDrop(x, y, radius) {
          return {
            x, y, prevX: x, prevY: y, r: radius, vx: 0, vy: 0,
            sliding: radius > 3.55, critR: 3.15 + Math.random() * 0.95,
            stallCooldown: 0.2 + Math.random() * 1.6, trail: [], distSincePoint: 0
          };
        }

        _detachTrailToRivulet(drop) {
          if (drop.trail.length >= 3) {
            this.rivulets.push({ pts: drop.trail, maxAge: 6.5 + Math.random() * 3.5 });
            if (this.rivulets.length > 52) this.rivulets.shift();
          }
        }

        _updateSnowGlass(dt, snowAmt, snowIntensity, windMs, shouldRender = true) {
          let modeSwitched = false;
          if (this.activeMode !== 'snow') {
            this.drops = []; this.rivulets = []; this.pinchedBeads = []; this.wetGrid.fill(0);
            this.mistCtx.clearRect(0, 0, this.size, this.size);
            this.seedInitialSnow();
            this.activeMode = 'snow';
            modeSwitched = true;
          }
          const S = this.size;
          const intensity = clamp(snowIntensity, 0.30, 1.35) * snowAmt;
          const snowCurve = Math.pow(clamp(snowIntensity, 0.30, 1.35), 1.25) * snowAmt;
          this.snowTime += dt;

          const targetCount = Math.round(45 + 165 * clamp(snowCurve, 0.18, 1.45));
          while (this.snowFlakes.length < targetCount) this.snowFlakes.push(this._makeSnowFlake(false));
          if (this.snowFlakes.length > targetCount) this.snowFlakes.length = targetCount;

          const windMag = Math.abs(windMs);
          const baseWindPx = S * clamp(windMs * 0.082, -0.82, 0.82);

          for (let i = 0; i < this.snowFlakes.length; i++) {
            const p = this.snowFlakes[i];
            p.flutterPhase += dt * p.flutterFreq;
            p.tumblePhase  += dt * p.tumbleRate;

            const eddy = this._sampleWindEddy(p.x / S, p.y / S, p.z, this.snowTime, windMag);
            const boundaryFactor = 0.58 + 0.56 * p.z;
            const glideX = Math.cos(p.flutterPhase) * p.flutterAmp;
            const liftY  = -0.28 * Math.abs(Math.sin(p.flutterPhase)) * p.flutterAmp;

            const targetVx = baseWindPx * boundaryFactor + eddy.ex * S + glideX;
            const targetVy = Math.max(S * 0.012, p.vt + eddy.ey * S * 0.72 + liftY);

            const relax = 1.0 - Math.exp(-dt * p.dragRate);
            p.vx += (targetVx - p.vx) * relax;
            p.vy += (targetVy - p.vy) * relax;
            p.x  += p.vx * dt;
            p.y  += p.vy * dt;

            if (p.y > S * 1.12) {
              p.y = -0.05 * S - Math.random() * 0.08 * S;
              p.x = (Math.random() * 1.32 - 0.16) * S;
            } else if (p.y < -0.18 * S) {
              p.y = S * 1.05;
            }
            if (p.x > S * 1.18) p.x -= S * 1.36;
            else if (p.x < -0.18 * S) p.x += S * 1.36;
          }

          this.snowAccum += dt * (2.2 * intensity + 0.4);
          const maxFlecks = Math.round(8 + 14 * intensity);
          while (this.snowAccum >= 1.0 && this.snowFlecks.length < maxFlecks) {
            this.snowAccum -= 1.0;
            this.snowFlecks.push({
              x: Math.random() * S, y: Math.random() * S,
              r: 0.95 + Math.random() * 1.65,
              age: 0, maxAge: 3.5 + Math.random() * 4.5
            });
          }
          for (let i = this.snowFlecks.length - 1; i >= 0; i--) {
            const f = this.snowFlecks[i];
            f.age += dt;
            if (f.age >= f.maxAge) this.snowFlecks.splice(i, 1);
          }

          if (!shouldRender && !modeSwitched && this.hasRenderedRain) {
            return false;
          }

          const ctx = this.ctx;
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, S, S);

          ctx.save();
          ctx.globalAlpha = clamp(0.35 + 0.55 * intensity, 0, 0.90);
          ctx.drawImage(this.frostCanvas, 0, 0);
          ctx.restore();

          ctx.globalCompositeOperation = 'lighter';
          for (let i = 0; i < this.snowFlakes.length; i++) {
            const p = this.snowFlakes[i];
            if (p.x < -55 || p.x > S + 55 || p.y < -55 || p.y > S + 55) continue;

            const sprite = p.z < 0.30 ? this.flakeSprites.near : (p.z < 0.66 ? this.flakeSprites.mid : this.flakeSprites.far);
            const baseDia = (26.0 + 18.0 * p.sizeClass) * (1.35 - 0.65 * p.z);
            const depthAlpha = (0.82 / (1.0 + p.z * p.z * 1.35)) * clamp(0.66 + 0.36 * intensity, 0.52, 1.00);
            if (depthAlpha <= 0.04) continue;

            const spd = Math.hypot(p.vx, p.vy);
            const motionStretch = clamp(1.0 + (spd / (S * 0.18)) * (0.68 * (1.0 - 0.32 * p.z)), 1.0, 2.65);
            const tumbleSquash = 0.70 + 0.30 * Math.abs(Math.cos(p.tumblePhase));
            const moveAng = Math.atan2(p.vy, p.vx);

            ctx.save();
            ctx.globalAlpha = clamp(depthAlpha, 0.04, 0.92);
            ctx.translate(p.x, p.y);
            ctx.rotate(moveAng);
            ctx.drawImage(
              sprite,
              -baseDia * 0.5 * motionStretch,
              -baseDia * 0.5 * tumbleSquash,
              baseDia * motionStretch,
              baseDia * tumbleSquash
            );
            ctx.restore();
          }

          for (let i = 0; i < this.snowFlecks.length; i++) {
            const f = this.snowFlecks[i];
            const u = f.age / f.maxAge;
            const env = smoothstep(0.0, 0.18, u) * (1.0 - smoothstep(0.58, 1.0, u));
            if (env <= 0.02) continue;
            const rr = f.r * (0.85 + 0.20 * env);
            const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, rr * 1.45);
            g.addColorStop(0.0, `rgba(${Math.round(155 * env)}, ${Math.round(32 * env)}, ${Math.round(58 * env)}, ${(0.24 * env).toFixed(3)})`);
            g.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(f.x, f.y, rr * 1.45, 0, Math.PI * 2); ctx.fill();
          }

          ctx.globalCompositeOperation = 'source-over';
          this.hasRenderedRain = true;
          return true;
        }

        update(dt, rainAmt, rainIntensity, snowAmt, snowIntensity, windMs, shouldRender = true) {
          if (rainAmt <= 0.008 && snowAmt <= 0.008) {
            if (this.hasRenderedRain) {
              this.drops = []; this.rivulets = []; this.pinchedBeads = []; this.snowFlecks = []; this.snowFlakes = []; this.wetGrid.fill(0);
              this.mistCtx.clearRect(0, 0, this.size, this.size);
              this.ctx.fillStyle = '#000000'; this.ctx.fillRect(0, 0, this.size, this.size);
              this.activeMode = 'none';
              this.hasRenderedRain = false; return true;
            }
            return false;
          }
          if (snowAmt > rainAmt) {
            return this._updateSnowGlass(dt, snowAmt, snowIntensity, windMs, shouldRender);
          }
          let modeSwitched = false;
          if (this.activeMode !== 'rain' || (this.drops.length === 0 && !this.hasRenderedRain)) {
            this.snowFlecks = []; this.snowFlakes = [];
            this.seedInitialRain();
            this.activeMode = 'rain';
            modeSwitched = true;
          }

          const S = this.size;
          const intensity = clamp(rainIntensity, 0.30, 1.35) * rainAmt;
          const precipCurve = Math.pow(clamp(rainIntensity, 0.30, 1.35), 1.30) * rainAmt;
          const windAbs = Math.abs(windMs);
          const windImpinge = 1.0 + clamp(windAbs * 0.14, 0.0, 1.35);
          const wetDecay = Math.exp(-dt * 0.085);
          for (let i = 0; i < this.wetGrid.length; i++) this.wetGrid[i] *= wetDecay;

          this.mistAccum += dt * (22.0 * precipCurve * (1.0 + clamp(windAbs * 0.11, 0.0, 1.05)));
          while (this.mistAccum >= 1.0) {
            this.mistAccum -= 1.0;
            this._condenseMistBead(Math.random() * S, Math.random() * S, 0.95 + Math.random() * 1.75);
          }

          this.spawnAccum += dt * (3.5 + 17.5 * precipCurve * windImpinge);
          const maxDrops = Math.round(28 + 78 * precipCurve + Math.min(32, windAbs * 2.8));
          while (this.spawnAccum >= 1.0 && this.drops.length < maxDrops) {
            this.spawnAccum -= 1.0;
            const spawnY = Math.random() < 0.30 ? Math.random() * S * 0.22 : Math.random() * S * 0.94;
            this.drops.push(this._makeDrop(Math.random() * S, spawnY, Math.random() < 0.16 ? (3.2 + Math.random() * 1.8) : (1.5 + Math.random() * 1.9)));
          }

          const mctx = this.mistCtx;
          for (let i = this.drops.length - 1; i >= 0; i--) {
            const d = this.drops[i];
            d.prevX = d.x; d.prevY = d.y;
            d.r = Math.min(6.4, d.r + dt * (0.14 + Math.random() * 0.12) * intensity * windImpinge);

            const surf = this._sampleGridGradX(d.x, d.y);
            const windDetach = clamp(windAbs * 0.022, 0.0, 0.20);
            const effectiveCritR = d.critR * (1.0 - 0.34 * surf.wetness - windDetach);

            if (!d.sliding) {
              d.vx *= 0.85; d.vy *= 0.85;
              if (d.r >= effectiveCritR) {
                d.stallCooldown -= dt * (0.8 + (d.r - effectiveCritR) * 1.6) * (1.0 + windAbs * 0.16);
                if (d.stallCooldown <= 0) {
                  d.sliding = true;
                  d.vy = 28 + (d.r - effectiveCritR) * 45;
                  d.vx = windMs * (10.5 + 4.5 * intensity);
                  d.trail.push({ x: d.x, y: d.y, w: d.r * 0.56, age: 0 });
                }
              }
            } else {
              const targetVy = Math.max(0.15, d.r - 2.35) * (56.0 + 34.0 * intensity) * (1.0 + 0.65 * surf.wetness);
              d.vy += (targetVy - d.vy) * Math.min(1.0, dt * 5.2);
              const targetVx = surf.gradX * 125.0 + windMs * (16.5 + 7.5 * intensity) + (Math.random() - 0.5) * 24.0;
              d.vx = clamp(d.vx + (targetVx - d.vx) * Math.min(1.0, dt * 7.0), -270, 270);
              d.x += d.vx * dt; d.y += d.vy * dt;

              const stepDist = Math.hypot(d.x - d.prevX, d.y - d.prevY);
              d.distSincePoint += stepDist;

              if (stepDist > 0.5) {
                mctx.save();
                mctx.globalCompositeOperation = 'destination-out';
                mctx.strokeStyle = 'rgba(0,0,0,0.88)';
                mctx.lineWidth = d.r * 2.15; mctx.lineCap = 'round';
                mctx.beginPath(); mctx.moveTo(d.prevX, d.prevY); mctx.lineTo(d.x, d.y); mctx.stroke();
                mctx.restore();
                this._depositWetness(d.x, d.y, 0.32);
                d.r = Math.max(2.3, d.r - stepDist * 0.0022);
              }

              if (d.distSincePoint >= 3.5) {
                d.distSincePoint = 0;
                d.trail.push({ x: d.x, y: d.y, w: d.r * 0.56, age: 0 });
                if (d.trail.length > 78) d.trail.shift();
                if (Math.random() < 0.085 && this.pinchedBeads.length < 95) {
                  this.pinchedBeads.push({ x: d.x + (Math.random() - 0.5) * 1.4, y: d.y - d.r * 1.1, r: 1.05 + Math.random() * 0.85, life: 1.0 });
                }
              }

              if (d.r < effectiveCritR * 0.84 || (surf.wetness < 0.15 && Math.random() < dt * 0.55 && d.r < 4.3)) {
                d.sliding = false; d.vy *= 0.2; d.stallCooldown = 0.6 + Math.random() * 2.4;
                this._detachTrailToRivulet(d); d.trail = [];
              }
            }

            for (let k = d.trail.length - 1; k >= 0; k--) {
              d.trail[k].age += dt;
              if (d.trail[k].age > 5.8) { d.trail.splice(0, k + 1); break; }
            }
            if (d.y > S + 14 || d.x < -14 || d.x > S + 14) { this._detachTrailToRivulet(d); this.drops.splice(i, 1); }
          }

          for (let i = 0; i < this.drops.length; i++) {
            const a = this.drops[i];
            for (let j = this.drops.length - 1; j > i; j--) {
              const b = this.drops[j];
              const dx = a.x - b.x, dy = a.y - b.y, lim = (a.r + b.r) * 0.92;
              if (dx * dx + dy * dy < lim * lim) {
                const vA = a.r * a.r * a.r, vB = b.r * b.r * b.r, vSum = vA + vB;
                const keepA = a.r >= b.r, big = keepA ? a : b, small = keepA ? b : a;
                big.x = (a.x * vA + b.x * vB) / vSum; big.y = (a.y * vA + b.y * vB) / vSum;
                big.vy = Math.max(big.vy, (a.vy * vA + b.vy * vB) / vSum + 25);
                big.r = Math.min(6.6, Math.cbrt(vSum));
                if (big.r > big.critR * 0.92) { big.sliding = true; big.stallCooldown = 0; }
                this._detachTrailToRivulet(small);
                if (keepA) { this.drops.splice(j, 1); } else { this.drops.splice(i, 1); i--; break; }
              }
            }
          }

          for (let i = this.rivulets.length - 1; i >= 0; i--) {
            const rv = this.rivulets[i];
            for (let k = rv.pts.length - 1; k >= 0; k--) rv.pts[k].age += dt;
            while (rv.pts.length > 0 && rv.pts[0].age > rv.maxAge) rv.pts.shift();
            if (rv.pts.length < 2) this.rivulets.splice(i, 1);
          }
          for (let i = this.pinchedBeads.length - 1; i >= 0; i--) {
            this.pinchedBeads[i].life -= dt * 0.14;
            if (this.pinchedBeads[i].life <= 0) this.pinchedBeads.splice(i, 1);
          }

          if (!shouldRender && !modeSwitched && this.hasRenderedRain) {
            return false;
          }

          this._render();
          this.hasRenderedRain = true;
          return true;
        }

        _drawRivuletRibbon(ctx, pts, maxAge) {
          if (pts.length < 2) return;
          ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          for (let i = 1; i < pts.length; i++) {
            const p0 = pts[i - 1], p1 = pts[i];
            const u = i / (pts.length - 1);
            const lifeFade = clamp(1.0 - p1.age / maxAge, 0, 1);
            if (lifeFade <= 0.01) continue;
            const taper = Math.pow(u, 0.72) * Math.pow(lifeFade, 0.85);
            const width = Math.max(0.75, p1.w * (0.28 + 0.92 * taper));
            ctx.strokeStyle = `rgba(0, 215, 0, ${clamp(0.34 * taper + 0.05 * lifeFade, 0, 0.42).toFixed(3)})`;
            ctx.lineWidth = width;
            ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();

            if (width > 0.85 && lifeFade > 0.12) {
              const cShift = Math.min(1.15, width * 0.32);
              ctx.strokeStyle = `rgba(255, 0, 0, ${clamp(0.54 * taper + 0.08 * lifeFade, 0, 0.64).toFixed(3)})`;
              ctx.lineWidth = Math.max(0.65, width * 0.52);
              ctx.beginPath(); ctx.moveTo(p0.x, p0.y + cShift); ctx.lineTo(p1.x, p1.y + cShift); ctx.stroke();
            }
          }
        }

        _drawTeardropLens(ctx, x, y, r, vx, vy, sliding) {
          const spd = Math.hypot(vx, vy);
          const stretch = 1.0 + clamp(spd / 170.0, 0, 0.95);
          const rx = r * (sliding ? 0.94 : 1.0), ry = r * stretch;
          const tiltAng = sliding ? -Math.atan2(vx, Math.max(24.0, vy)) : 0.0;
          ctx.save(); ctx.translate(x, y);
          if (Math.abs(tiltAng) > 0.01) ctx.rotate(clamp(tiltAng, -1.08, 1.08));
          ctx.beginPath();
          ctx.moveTo(0, -ry * 1.45);
          ctx.bezierCurveTo(rx * 0.55, -ry * 0.55, rx * 1.08, 0, rx * 1.02, ry * 0.45);
          ctx.bezierCurveTo(rx * 0.96, ry * 1.02, -rx * 0.96, ry * 1.02, -rx * 1.02, ry * 0.45);
          ctx.bezierCurveTo(-rx * 1.08, 0, -rx * 0.55, -ry * 0.55, 0, -ry * 1.45);
          ctx.closePath();

          const gradRim = ctx.createRadialGradient(0, ry * 0.16, rx * 0.12, 0, ry * 0.08, Math.max(rx, ry) * 1.15);
          gradRim.addColorStop(0.0,  'rgba(0, 130, 0, 0.18)');
          gradRim.addColorStop(0.52, 'rgba(0, 170, 0, 0.34)');
          gradRim.addColorStop(0.84, 'rgba(0, 230, 0, 0.78)');
          gradRim.addColorStop(1.0,  'rgba(0, 195, 0, 0.52)');
          ctx.fillStyle = gradRim; ctx.fill();
          ctx.strokeStyle = 'rgba(0, 240, 0, 0.56)';
          ctx.lineWidth = Math.max(0.65, r * 0.20); ctx.stroke();

          if (r > 1.15) {
            const cy = ry * 0.36, cr = rx * 0.82;
            const gradC = ctx.createRadialGradient(0, cy, 0, 0, cy, cr);
            gradC.addColorStop(0.0,  'rgba(255, 0, 0, 1.0)');
            gradC.addColorStop(0.50, 'rgba(245, 0, 0, 0.64)');
            gradC.addColorStop(1.0,  'rgba(0, 0, 0, 0.0)');
            ctx.fillStyle = gradC;
            ctx.beginPath(); ctx.ellipse(0, cy, cr, cr * 0.82, 0, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
        }

        _render() {
          const ctx = this.ctx, S = this.size;
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, S, S);
          ctx.drawImage(this.mistCanvas, 0, 0);
          ctx.globalCompositeOperation = 'lighter';

          for (let i = 0; i < this.rivulets.length; i++) this._drawRivuletRibbon(ctx, this.rivulets[i].pts, this.rivulets[i].maxAge);
          for (let i = 0; i < this.pinchedBeads.length; i++) {
            const b = this.pinchedBeads[i], a = clamp(b.life, 0, 1);
            ctx.fillStyle = `rgba(${Math.round(180 * a)}, ${Math.round(170 * a)}, 0, ${(0.55 * a).toFixed(3)})`;
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (0.6 + 0.4 * a), 0, Math.PI * 2); ctx.fill();
          }
          for (let i = 0; i < this.drops.length; i++) {
            const d = this.drops[i];
            if (d.trail.length >= 2) this._drawRivuletRibbon(ctx, d.trail, 5.8);
            this._drawTeardropLens(ctx, d.x, d.y, d.r, d.vx, d.vy, d.sliding);
          }
          ctx.globalCompositeOperation = 'source-over';
        }
      }

      class ThunderLightningEngine {
        constructor() { this.reset(); }
        reset() {
          this.nextFlashIn = 3.6 + Math.random() * 4.8;
          this.activeEvent = null;
          this.uniform = [0.0, 0.5, 0.0, 0.0];
        }
        _spawnEvent(intensity) {
          const isNearby = Math.random() < (0.30 + 0.14 * clamp(intensity, 0.3, 1.3));
          const isDouble = Math.random() < 0.35;
          const strokes = [];
          strokes.push({
            start: 0.0,
            rise: isNearby ? (0.065 + Math.random() * 0.030) : (0.095 + Math.random() * 0.045),
            decay: isNearby ? (0.200 + Math.random() * 0.080) : (0.260 + Math.random() * 0.110),
            amp: isNearby ? (0.64 + Math.random() * 0.14) : (0.38 + Math.random() * 0.16)
          });
          let endOffset = 0.0;
          if (isDouble) {
            endOffset = 0.42 + Math.random() * 0.16;
            strokes.push({
              start: endOffset,
              rise: 0.080 + Math.random() * 0.040,
              decay: 0.240 + Math.random() * 0.110,
              amp: strokes[0].amp * (0.48 + Math.random() * 0.20)
            });
          }
          const duration = endOffset + 1.65;
          return {
            age: 0,
            duration,
            strokes,
            sharpness: isNearby ? (0.55 + Math.random() * 0.28) : (0.12 + Math.random() * 0.20),
            shiftR: (Math.random() - 0.5) * 0.065,
            shiftS: (Math.random() - 0.45) * 0.040
          };
        }
        update(dt, thunderAmt, intensity) {
          if (thunderAmt <= 0.05) {
            this.activeEvent = null;
            this.uniform[0] *= Math.exp(-dt * 8.0);
            if (this.uniform[0] < 0.0008) this.uniform[0] = 0.0;
            this.nextFlashIn = Math.min(this.nextFlashIn, 4.0);
            return this.uniform;
          }
          if (!this.activeEvent) {
            this.nextFlashIn -= dt;
            if (this.nextFlashIn <= 0) {
              this.activeEvent = this._spawnEvent(intensity);
              const freqScale = mix(1.30, 0.82, clamp((intensity - 0.3) / 1.0, 0, 1));
              this.nextFlashIn = Math.max(8.5, (10.5 + Math.random() * 10.0) * freqScale);
            }
          }
          let val = 0.0;
          if (this.activeEvent) {
            const ev = this.activeEvent;
            ev.age += dt;
            for (let i = 0; i < ev.strokes.length; i++) {
              const st = ev.strokes[i];
              const localT = ev.age - st.start;
              if (localT < 0) continue;
              let env;
              if (localT < st.rise) {
                const u = localT / st.rise;
                env = u * u * (3.0 - 2.0 * u);
              } else {
                const td = localT - st.rise;
                env = Math.exp(-td / st.decay) * 0.86 + Math.exp(-td / (st.decay * 2.3)) * 0.14;
              }
              val += st.amp * env;
            }
            const tailFade = 1.0 - smoothstep(ev.duration - 0.55, ev.duration, ev.age);
            val = Math.min(0.78, val) * tailFade * thunderAmt;
            this.uniform[0] = val;
            this.uniform[1] = ev.sharpness;
            this.uniform[2] = ev.shiftR;
            this.uniform[3] = ev.shiftS;
            if (ev.age >= ev.duration) {
              this.uniform[0] = 0.0;
              this.activeEvent = null;
            }
          } else {
            this.uniform[0] = 0.0;
          }
          return this.uniform;
        }
      }

      const TAN_NORM_068 = 0.80866137;
      function evalCelestialArc(t, rMin, rMax, sHigh, sLow, slopeShift = 0.0, sClampMin = 0.20, sClampMax = 0.68) {
        const tc = clamp(t, 0.0, 1.0);
        const r = mix(rMin, rMax, Math.tan(tc * 0.68) / TAN_NORM_068);
        const cosBell = Math.cos(tc * Math.PI * 0.5);
        const sBase = mix(sLow, sHigh, Math.pow(cosBell, 0.90));
        const s = clamp(sBase + slopeShift * (0.30 + 0.70 * cosBell), sClampMin, sClampMax);
        return { r, s };
      }

      function computeSweepLighting(hour, season, sunsetDrama, dampedCloudSoft, cloudTrans, rainAmt, thunderAmt = 0.0, snowAmt = 0.0, slopeShiftOverride = null) {
        const meta = SEASON_META[season];
        const slopeShift = (slopeShiftOverride !== null && Number.isFinite(slopeShiftOverride)) ? slopeShiftOverride : meta.slopeShift;
        const h = ((hour % 24) + 24) % 24;
        const cloudAtten = (1.0 - (dampedCloudSoft - 1.0) * 0.24) * cloudTrans;

        let winSide = 1.0, r = 1.19, s = 0.42, beamFade = 0.0, rainEnv = 0.0, beamColor = [1, 1, 1], beamPower = 0.0;
        let isMoon = 0.0, sunsetHeat = 0.0, dawnWarmth = 0.0;

        const noonBell         = Math.exp(-Math.pow((h - 12.12) / 0.72, 2.0));
        const twilightBell     = Math.exp(-Math.pow((h - 18.92) / 0.50, 2.0));
        const twilightHorizon  = Math.exp(-Math.pow((h - 18.74) / 0.44, 2.0));
        const dawnBell         = Math.exp(-Math.pow((h - 6.55) / 0.78, 2.0));
        const earlyDawnCool    = Math.exp(-Math.pow((h - 6.28) / 0.68, 2.0));
        const goldenMornBounce = Math.exp(-Math.pow((h - 7.22) / 0.68, 2.0));
        const dayEnv           = smootherstep(5.48, 6.85, h) * (1.0 - smootherstep(18.30, 19.55, h));
        const duskEnv          = smootherstep(16.65, 18.55, h) * (1.0 - smootherstep(19.55, 20.45, h));

        if (h >= 5.54 && h < 12.12) {
          winSide = -1.0; isMoon = 0.0;
          const dawnIn = smootherstep(5.54, 6.55, h);
          const noonOut = 1.0 - smootherstep(10.55, 11.75, h);
          beamFade = Math.pow(dawnIn, 1.28) * noonOut;
          rainEnv  = smootherstep(5.55, 6.22, h) * (1.0 - smootherstep(11.15, 12.02, h));
          const u = clamp((h - 5.58) / 6.17, 0, 1);
          const arc = evalCelestialArc(1.0 - u, 0.27, 1.46, 0.62, 0.24, slopeShift, 0.20, 0.68);
          r = arc.r; s = arc.s;
          dawnWarmth = smootherstep(5.52, 6.28, h) * (1.0 - smootherstep(7.35, 8.65, h));
          // Stage 1-2: velvety peach-apricot -> Stage 3: radiant honey-gold amber -> crisp morning light
          let col = mix3([1.44, 0.76, 0.46], [1.48, 0.88, 0.42], smoothstep(5.95, 6.95, h));
          col = mix3(col, [1.34, 0.97, 0.62], smoothstep(6.95, 7.90, h));
          col = mix3(col, [1.14, 1.03, 0.88], smoothstep(7.90, 9.35, h));
          col = mix3(col, [1.04, 1.02, 0.98], smoothstep(9.35, 11.45, h));
          beamColor = [col[0] * meta.tint[0], col[1] * meta.tint[1], col[2] * meta.tint[2]];
          const dawnPowerEase = mix(0.76, 1.0, smoothstep(0.0, 0.52, dawnIn));
          const dawnPeak = smoothstep(5.85, 7.15, h) * (1.0 - 0.34 * smoothstep(7.50, 9.50, h));
          beamPower = mix(1.42, 1.68, dawnPeak) * dawnPowerEase * cloudAtten;
        } else if (h >= 12.12 && h < 19.22) {
          winSide = 1.0; isMoon = 0.0;
          const noonIn = smootherstep(12.50, 13.70, h);
          const sunsetTail = 1.0 - smootherstep(17.88, 18.92, h);
          beamFade = noonIn * Math.pow(sunsetTail, 1.35);
          rainEnv  = smootherstep(12.22, 12.85, h) * (1.0 - smootherstep(18.88, 19.20, h));
          const u = clamp((h - 12.50) / 6.42, 0, 1);
          const arc = evalCelestialArc(u, 0.27, 1.46, 0.62, 0.24, slopeShift, 0.20, 0.68);
          r = arc.r; s = arc.s;
          sunsetHeat = smootherstep(16.55, 17.85, h) * (1.0 - smootherstep(18.40, 19.04, h));
          let col = mix3([1.04, 1.01, 0.96], [1.15, 0.94, 0.74], smoothstep(12.60, 14.85, h));
          col = mix3(col, [1.28, 0.85, 0.47], smoothstep(14.85, 16.65, h));
          col = mix3(col, [1.41, 0.66, 0.22], smoothstep(16.65, 17.90, h));
          col = mix3(col, [1.36, 0.45, 0.13], smoothstep(18.00, 18.78, h) * 0.74);
          const drama = mix(1.0, sunsetDrama, sunsetHeat);
          beamColor = [
            col[0] * meta.tint[0] * mix(1.0, 1.12, clamp((drama - 1.0) * 1.0, -0.5, 0.60)),
            col[1] * meta.tint[1] * mix(1.0, 0.89, clamp((drama - 1.0) * 0.80, -0.45, 0.50)),
            col[2] * meta.tint[2] * mix(1.0, 0.48, clamp((drama - 1.0) * 1.1, -0.55, 0.75))
          ];
          const tailPowerEase = mix(0.68, 1.0, smoothstep(0.0, 0.55, sunsetTail));
          beamPower = mix(1.48, 1.72, sunsetHeat * clamp(sunsetDrama, 0.6, 1.40)) * tailPowerEase * cloudAtten;
        } else {
          winSide = 1.0; isMoon = 1.0;
          const moonIn = smootherstep(19.32, 20.36, h);
          const moonOut = 1.0 - smootherstep(4.44, 5.48, h);
          beamFade = h >= 19.22 ? moonIn : Math.pow(moonOut, 1.35);
          rainEnv  = h >= 19.22 ? smootherstep(19.23, 19.72, h) : (1.0 - smootherstep(4.80, 5.52, h));
          const elapsed = h >= 19.22 ? (h - 19.32) : (4.68 + h);
          const u = clamp(elapsed / 10.16, 0, 1);
          const arc = evalCelestialArc(u, 0.42, 1.44, 0.50, 0.23, slopeShift * 0.35, 0.22, 0.52);
          r = arc.r; s = arc.s;
          beamColor = [
            0.46 * mix(1.0, meta.tint[0], 0.22),
            0.64 * mix(1.0, meta.tint[1], 0.22),
            1.12 * mix(1.0, meta.tint[2], 0.22)
          ];
          beamPower = 0.62 * cloudAtten;
        }

        const dramaGuard = Math.max(sunsetHeat, twilightBell);
        if (rainAmt > 0.001) {
          const rainTargetCol = mix3([0.46, 0.62, 0.98], [0.76, 0.85, 0.96], dayEnv);
          const rainTintAmt = rainAmt * clamp(0.36 - 0.16 * sunsetHeat - 0.10 * dawnWarmth, 0.16, 0.38);
          beamColor = mix3(beamColor, rainTargetCol, rainTintAmt);
          const rainPowerScale = mix(1.0, isMoon > 0.5 ? 0.72 : 0.62, rainAmt);
          beamPower *= rainPowerScale;
          sunsetHeat *= (1.0 - rainAmt * 0.26);
          dawnWarmth *= (1.0 - rainAmt * 0.26);
          const rainFloor = 0.62 * rainEnv;
          beamFade = beamFade + Math.max(0.0, rainFloor - beamFade) * rainAmt;
        }
        if (thunderAmt > 0.001) {
          const stormBeamCol = mix3([0.38, 0.52, 0.88], [0.60, 0.72, 0.90], dayEnv);
          beamColor = mix3(beamColor, stormBeamCol, thunderAmt * clamp(0.62 - 0.16 * dramaGuard, 0.36, 0.64));
          beamPower *= mix(1.0, isMoon > 0.5 ? 0.68 : 0.64, thunderAmt);
          sunsetHeat *= (1.0 - thunderAmt * 0.42);
          dawnWarmth *= (1.0 - thunderAmt * 0.42);
        }
        if (snowAmt > 0.001) {
          const snowTargetCol = mix3([0.56, 0.72, 1.08], [0.82, 0.91, 1.08], dayEnv);
          const snowTintAmt = snowAmt * clamp(0.58 - 0.22 * sunsetHeat - 0.12 * dawnWarmth, 0.22, 0.60);
          beamColor = mix3(beamColor, snowTargetCol, snowTintAmt);
          const snowPowerScale = mix(1.0, isMoon > 0.5 ? 0.88 : 0.76, snowAmt);
          beamPower *= snowPowerScale;
          sunsetHeat *= (1.0 - snowAmt * 0.24);
          dawnWarmth *= (1.0 - snowAmt * 0.24);
          const snowFloor = 0.68 * rainEnv;
          beamFade = beamFade + Math.max(0.0, snowFloor - beamFade) * snowAmt;
        }

        let dayAmb = mix3([0.162, 0.198, 0.264], [0.172, 0.192, 0.234], smoothstep(10.5, 14.0, h));
        dayAmb = mix3(dayAmb, [0.084, 0.114, 0.172], earlyDawnCool * 0.84);
        dayAmb = mix3(dayAmb, [0.152, 0.138, 0.128], goldenMornBounce * 0.38);
        dayAmb = mix3(dayAmb, [0.218, 0.236, 0.264], noonBell * 0.92);
        dayAmb = mix3(dayAmb, [0.070, 0.080, 0.122], duskEnv * (0.76 + 0.18 * clamp(sunsetDrama, 0.6, 1.3)));
        let ambientCol = mix3(mix3([0.020, 0.029, 0.056], dayAmb, dayEnv), [0.054, 0.058, 0.106], twilightBell * 0.88);

        const mornEnv = smoothstep(5.45, 6.80, h) * (1.0 - smoothstep(11.75, 13.4, h));
        const mornEdgeCue = smootherstep(10.1, 11.45, h) * (1.0 - smootherstep(11.65, 12.20, h));
        const dawnGlowGate = smootherstep(5.60, 6.22, h);
        let leftGlowCol = mix3([0.006, 0.010, 0.024], mix3([0.072, 0.088, 0.120], [0.142, 0.170, 0.222], mornEnv), dayEnv);
        leftGlowCol = mix3(leftGlowCol, [0.220, 0.122, 0.086], dawnBell * dawnGlowGate * 0.64);
        leftGlowCol = mix3(leftGlowCol, [0.022, 0.032, 0.060], duskEnv * 0.86);
        leftGlowCol = mix3(leftGlowCol, [0.024, 0.032, 0.064], twilightBell * 0.86);
        leftGlowCol = mix3(leftGlowCol, [0.132, 0.146, 0.172], noonBell * 0.90);
        leftGlowCol = mix3(leftGlowCol, [0.195, 0.210, 0.234], mornEdgeCue * 0.65);

        const aftEnv = smoothstep(11.2, 13.0, h) * (1.0 - smoothstep(18.6, 19.75, h));
        const aftEdgeCue = smootherstep(11.80, 12.35, h) * (1.0 - smootherstep(12.85, 14.0, h));
        let rightGlowCol = mix3([0.014, 0.022, 0.046], mix3([0.088, 0.110, 0.152], [0.138, 0.128, 0.122], aftEnv), dayEnv);
        rightGlowCol = mix3(rightGlowCol, [0.165, 0.088, 0.048], sunsetHeat * 0.86);
        rightGlowCol = mix3(rightGlowCol, [0.082, 0.058, 0.096], twilightBell * 0.90);
        rightGlowCol = mix3(rightGlowCol, [0.132, 0.146, 0.172], noonBell * 0.90);
        rightGlowCol = mix3(rightGlowCol, [0.195, 0.208, 0.226], aftEdgeCue * 0.65);

        const dawnHorizon = dawnBell * smootherstep(5.62, 6.20, h);
        const weatherHorizDim = 1.0 - rainAmt * 0.28 - thunderAmt * 0.14 - snowAmt * 0.12;
        const horizonGlowCol = winSide > 0.0
          ? [0.128 * twilightHorizon * weatherHorizDim, 0.066 * twilightHorizon * weatherHorizDim, 0.072 * twilightHorizon * (1.0 - rainAmt * 0.16)]
          : [0.190 * dawnHorizon * weatherHorizDim, 0.102 * dawnHorizon * weatherHorizDim, 0.068 * dawnHorizon * (1.0 - rainAmt * 0.16)];

        if (rainAmt > 0.001) {
          const ambDim = mix(1.0, mix(0.80, 0.70, dayEnv) + 0.06 * dramaGuard, rainAmt);
          const coolR = mix(1.0, mix(0.90, 0.96, dramaGuard), rainAmt);
          const coolG = mix(1.0, mix(0.96, 0.96, dramaGuard), rainAmt);
          const coolB = mix(1.0, mix(1.08, 1.05, dramaGuard), rainAmt);
          ambientCol = [ambientCol[0] * ambDim * coolR, ambientCol[1] * ambDim * coolG, ambientCol[2] * ambDim * coolB];
          const glowDim = mix(1.0, mix(0.78, 0.66, dayEnv) + 0.06 * dramaGuard, rainAmt);
          leftGlowCol  = [leftGlowCol[0]  * glowDim * coolR, leftGlowCol[1]  * glowDim * coolG, leftGlowCol[2]  * glowDim * coolB];
          rightGlowCol = [rightGlowCol[0] * glowDim * coolR, rightGlowCol[1] * glowDim * coolG, rightGlowCol[2] * glowDim * coolB];
        }
        if (thunderAmt > 0.001) {
          const stDim = mix(1.0, mix(0.82, 0.78, dayEnv) + 0.04 * dramaGuard, thunderAmt);
          const stR = mix(1.0, 0.88, thunderAmt);
          const stG = mix(1.0, 0.93, thunderAmt);
          const stB = mix(1.0, 1.09, thunderAmt);
          ambientCol   = [ambientCol[0]   * stDim * stR, ambientCol[1]   * stDim * stG, ambientCol[2]   * stDim * stB];
          leftGlowCol  = [leftGlowCol[0]  * stDim * stR, leftGlowCol[1]  * stDim * stG, leftGlowCol[2]  * stDim * stB];
          rightGlowCol = [rightGlowCol[0] * stDim * stR, rightGlowCol[1] * stDim * stG, rightGlowCol[2] * stDim * stB];
        }
        if (snowAmt > 0.001) {
          const snowAmbScale = mix(1.0, mix(1.22, 1.04, dayEnv), snowAmt);
          const snR = mix(1.0, mix(0.87, 0.94, dramaGuard), snowAmt);
          const snG = mix(1.0, mix(0.95, 0.96, dramaGuard), snowAmt);
          const snB = mix(1.0, 1.15, snowAmt);
          ambientCol   = [ambientCol[0]   * snowAmbScale * snR, ambientCol[1]   * snowAmbScale * snG, ambientCol[2]   * snowAmbScale * snB];
          leftGlowCol  = [leftGlowCol[0]  * snowAmbScale * snR, leftGlowCol[1]  * snowAmbScale * snG, leftGlowCol[2]  * snowAmbScale * snB];
          rightGlowCol = [rightGlowCol[0] * snowAmbScale * snR, rightGlowCol[1] * snowAmbScale * snG, rightGlowCol[2] * snowAmbScale * snB];
        }

        let phaseKey = 'quietNight';
        if (thunderAmt > 0.45) phaseKey = dayEnv > 0.35 ? 'thunderDay' : 'thunderNight';
        else if (snowAmt > 0.45) phaseKey = dayEnv > 0.35 ? 'snowDay' : 'snowNight';
        else if (rainAmt > 0.45) phaseKey = dayEnv > 0.35 ? 'rainDay' : 'rainNight';
        else if (h >= 4.44 && h < 5.54) phaseKey = 'moonFade';
        else if (h >= 5.54 && h < 6.62) phaseKey = 'dawnDim';
        else if (h >= 6.62 && h < 10.55) phaseKey = 'morningClear';
        else if (h >= 10.55 && h < 11.75) phaseKey = 'preNoon';
        else if (h >= 11.75 && h < 12.50) phaseKey = 'noonLight';
        else if (h >= 12.50 && h < 13.70) phaseKey = 'afternoonIn';
        else if (h >= 13.70 && h < 15.65) phaseKey = 'afternoonWarm';
        else if (h >= 15.65 && h < 17.15) phaseKey = 'goldenCenter';
        else if (h >= 17.15 && h < 18.08) phaseKey = 'duskGlow';
        else if (h >= 18.08 && h < 18.92) phaseKey = 'sunsetFade';
        else if (h >= 18.92 && h < 19.32) phaseKey = 'twilight';
        else if (h >= 19.32 && h < 20.36) phaseKey = 'moonIn';

        const phaseLabel = (t('phases') || {})[phaseKey] || phaseKey;
        return { winSide, r, s, beamFade, beamColor, beamPower, isMoon, sunsetHeat, dawnWarmth, ambientCol, leftGlowCol, rightGlowCol, horizonGlowCol, phaseLabel };
      }

      function computeWallWindowBounds(cel) {
        const g = state.roomGeom;
        const r = Math.max(cel.r, 0.20), s = Math.max(cel.s, 0.05);
        const dxCenter = g.zCenter * r;
        return {
          cx: cel.winSide * (g.W - dxCenter),
          cy: g.yCenter - dxCenter * s,
          halfW: 0.5 * g.zWidth * r,
          halfH: 0.5 * g.yHeight
        };
      }

      let weatherReqSeq = 0;

      function withTimeout(promise, ms, label = 'Timeout') {
        let timer;
        const guard = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error(label)), ms); });
        return Promise.race([promise, guard]).finally(() => clearTimeout(timer));
      }

      async function fetchJson(url, timeoutMs = 2600, externalSignal = null) {
        const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
        let timer;
        const onExtAbort = () => { if (ctrl) { try { ctrl.abort(); } catch (_) {} } };
        if (externalSignal) {
          if (externalSignal.aborted) {
            if (ctrl) { try { ctrl.abort(); } catch (_) {} }
          } else if (typeof externalSignal.addEventListener === 'function') {
            externalSignal.addEventListener('abort', onExtAbort, { once: true });
          }
        }
        const fetchTask = (async () => {
          const res = await fetch(url, ctrl ? { signal: ctrl.signal } : undefined);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return await res.json();
        })();
        const guard = new Promise((_, rej) => {
          timer = setTimeout(() => {
            if (ctrl) { try { ctrl.abort(); } catch (_) {} }
            rej(new Error('Fetch timeout'));
          }, timeoutMs);
        });
        try { return await Promise.race([fetchTask, guard]); }
        finally {
          clearTimeout(timer);
          if (externalSignal && typeof externalSignal.removeEventListener === 'function') {
            externalSignal.removeEventListener('abort', onExtAbort);
          }
        }
      }

      async function getBrowserGeo(timeoutMs = 1500) {
        if (!navigator.geolocation) throw new Error('No geo');
        if (navigator.permissions && navigator.permissions.query) {
          try {
            const perm = await withTimeout(navigator.permissions.query({ name: 'geolocation' }), 350, 'Perm timeout');
            if (perm && perm.state === 'denied') throw new Error('Geo denied');
          } catch (e) {
            if (e && e.message === 'Geo denied') throw e;
          }
        }
        return new Promise((res, rej) => {
          let settled = false;
          const guard = setTimeout(() => { if (!settled) { settled = true; rej(new Error('Geo timeout')); } }, timeoutMs);
          try {
            navigator.geolocation.getCurrentPosition(
              p => { if (!settled) { settled = true; clearTimeout(guard); res({ lat: p.coords.latitude, lon: p.coords.longitude }); } },
              err => { if (!settled) { settled = true; clearTimeout(guard); rej(err); } },
              { enableHighAccuracy: false, timeout: timeoutMs, maximumAge: 600000 }
            );
          } catch (err) {
            if (!settled) { settled = true; clearTimeout(guard); rej(err); }
          }
        });
      }

      function fetchIpLocation(timeoutMs = 2200) {
        const makeCtrl = () => (typeof AbortController !== 'undefined' ? new AbortController() : null);
        const ctrls = [makeCtrl(), makeCtrl(), makeCtrl()];
        const abortRemaining = (winnerIdx) => {
          for (let i = 0; i < ctrls.length; i++) {
            if (i !== winnerIdx && ctrls[i]) {
              try { ctrls[i].abort(); } catch (_) {}
            }
          }
        };
        const tasks = [
          async (signal) => {
            const d = await fetchJson('https://get.geojs.io/v1/ip/geo.json', timeoutMs, signal);
            if (d && d.latitude && d.longitude) {
              const lat = parseFloat(d.latitude), lon = parseFloat(d.longitude);
              if (isFinite(lat) && isFinite(lon)) return { lat, lon, city: d.city || d.region || d.country || '本机位置' };
            }
            throw new Error('geojs invalid');
          },
          async (signal) => {
            const d = await fetchJson('https://ipapi.co/json/', timeoutMs, signal);
            if (d && d.latitude && d.longitude) {
              const lat = parseFloat(d.latitude), lon = parseFloat(d.longitude);
              if (isFinite(lat) && isFinite(lon)) return { lat, lon, city: d.city || d.region || d.country_name || '本机位置' };
            }
            throw new Error('ipapi invalid');
          },
          async (signal) => {
            const d = await fetchJson('https://ipwho.is/', timeoutMs, signal);
            if (d && d.success !== false && d.latitude && d.longitude) {
              const lat = parseFloat(d.latitude), lon = parseFloat(d.longitude);
              if (isFinite(lat) && isFinite(lon)) return { lat, lon, city: d.city || d.region || d.country || '本机位置' };
            }
            throw new Error('ipwho invalid');
          }
        ];
        return withTimeout(new Promise((resolve, reject) => {
          let pending = tasks.length;
          let resolved = false;
          tasks.forEach((fn, idx) => {
            fn(ctrls[idx] ? ctrls[idx].signal : null).then(loc => {
              if (!resolved) {
                resolved = true;
                abortRemaining(idx);
                resolve(loc);
              }
            }).catch(() => {
              pending--;
              if (pending === 0 && !resolved) reject(new Error('无法自动定位'));
            });
          });
        }), timeoutMs + 200, 'IP locate timeout').finally(() => {
          abortRemaining(-1);
        });
      }

      function getWeatherDescText(w) {
        if (w && w.descKey) {
          const map = t('wmo');
          if (map && map[w.descKey]) return map[w.descKey];
        }
        return (w && w.descText) ? w.descText : t('wxClear');
      }

      function classifyWmoWeather(wCode, precipMm, rainMm, showersMm, snowfallCm) {
        const totalRain = Math.max(rainMm + showersMm, snowfallCm <= 0.05 ? precipMm : 0);
        const wmoDict = t('wmo') || {};
        if (wCode === 95 || wCode === 96 || wCode === 99) {
          const intVal = totalRain > 0.05
            ? clamp(0.72 + 0.28 * Math.log1p(totalRain * 1.4), 0.72, 1.32)
            : (wCode >= 96 ? 1.12 : 0.90);
          const descKey = wCode >= 96 ? 'severeThunder' : 'thunder';
          return { weatherType: 'thunder', intensity: intVal, descKey, descText: wmoDict[descKey] || '雷阵雨' };
        }
        if ((wCode >= 71 && wCode <= 77) || wCode === 85 || wCode === 86 || snowfallCm > 0.05) {
          let intVal;
          if (snowfallCm > 0.05) intVal = clamp(0.42 + 0.42 * Math.log1p(snowfallCm * 2.2), 0.42, 1.30);
          else if (wCode === 75 || wCode === 86) intVal = 1.15;
          else if (wCode === 73 || wCode === 85) intVal = 0.84;
          else intVal = 0.52;
          const descKey = intVal > 1.0 ? 'heavySnow' : (intVal > 0.72 ? 'modSnow' : 'lightSnow');
          return { weatherType: 'snow', intensity: intVal, descKey, descText: wmoDict[descKey] || '落雪' };
        }
        if ((wCode >= 51 && wCode <= 67) || (wCode >= 80 && wCode <= 82) || totalRain > 0.05) {
          let intVal;
          if (totalRain > 0.05) intVal = clamp(0.40 + 0.34 * Math.log1p(totalRain * 1.35), 0.38, 1.30);
          else if (wCode === 65 || wCode === 82) intVal = 1.15;
          else if (wCode === 63 || wCode === 81 || wCode === 55) intVal = 0.85;
          else intVal = 0.52;
          const descKey = intVal > 1.02 ? 'heavyRain' : (intVal > 0.72 ? 'modRain' : (wCode >= 51 && wCode <= 57 ? 'drizzle' : 'lightRain'));
          return { weatherType: 'rain', intensity: intVal, descKey, descText: wmoDict[descKey] || '降雨' };
        }
        let descKey = 'clear';
        if (wCode === 1) descKey = 'mostlyClear';
        else if (wCode === 2) descKey = 'partlyCloudy';
        else if (wCode === 3) descKey = 'overcast';
        else if (wCode === 45 || wCode === 48) descKey = 'fog';
        return { weatherType: 'clear', intensity: 0.0, descKey, descText: wmoDict[descKey] || '晴朗' };
      }

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&current=temperature_2m,wind_speed_10m,wind_gusts_10m,cloud_cover,precipitation,rain,showers,snowfall,weather_code&wind_speed_unit=ms`;
        const data = await fetchJson(url, 3200);
        if (!data || !data.current) throw new Error('Weather API error');
        const cur = data.current;
        const precipMm = Math.max(0, Number(cur.precipitation ?? 0));
        const rainMm = Math.max(0, Number(cur.rain ?? 0));
        const showersMm = Math.max(0, Number(cur.showers ?? 0));
        const snowfallCm = Math.max(0, Number(cur.snowfall ?? 0));
        const wCode = Number(cur.weather_code ?? 0);
        const windMs = Math.max(0, Number(cur.wind_speed_10m ?? 2.2));
        const gustMs = Math.max(windMs, Number(cur.wind_gusts_10m ?? (windMs * 1.45)));
        const cloudPct = clamp(Number(cur.cloud_cover ?? 18), 0, 100);
        const tempC = cur.temperature_2m != null ? Number(cur.temperature_2m) : null;
        const cls = classifyWmoWeather(wCode, precipMm, rainMm, showersMm, snowfallCm);

        Object.assign(state.weather, {
          loaded: true, loading: false, source, lat, lon, city: cityLabel, tempC,
          windMs, gustMs, cloudPct, precipMm: Math.max(precipMm, rainMm + showersMm),
          rainMm: rainMm + showersMm, snowfallCm, weatherCode: wCode,
          weatherType: cls.weatherType, livePrecipIntensity: cls.intensity, descKey: cls.descKey, descText: cls.descText, error: ''
        });
        saveCachedWeather(true);
      }

      async function autoLocateAndFetchWeather(silent = false) {
        if (silent) {
          const cachedWx = loadCachedWeather(10 * 60 * 1000);
          if (cachedWx) {
            applyCachedWeatherPayload(cachedWx, false);
            syncUI();
            return;
          }
        }
        const reqId = ++weatherReqSeq;
        if (state.weatherCityMode === 'custom' && Number.isFinite(state.customCityLat) && Number.isFinite(state.customCityLon)) {
          state.weather.city = state.customCityName || t('wxLocalPos');
        }
        state.weather.loading = true; state.weather.error = ''; renderWeatherUI();
        try {
          if (typeof navigator !== 'undefined' && navigator.onLine === false) {
            throw new Error('Offline');
          }
          const runPipeline = async () => {
            if (state.weatherCityMode === 'custom' && Number.isFinite(state.customCityLat) && Number.isFinite(state.customCityLon)) {
              await fetchOpenMeteo(state.customCityLat, state.customCityLon, state.customCityName || t('wxLocalPos'), 'custom');
              return;
            }
            const ipPromise = fetchIpLocation(2200).catch(() => null);
            let loc = null, src = 'ip';
            try {
              const pos = await getBrowserGeo(1500);
              src = 'geo';
              let city = `${pos.lat.toFixed(2)}°, ${pos.lon.toFixed(2)}°`;
              const ip = await withTimeout(ipPromise, 700, 'City timeout').catch(() => null);
              if (ip && ip.city && Math.hypot(ip.lat - pos.lat, ip.lon - pos.lon) < 2.0) city = ip.city;
              loc = { lat: pos.lat, lon: pos.lon, city };
            } catch (_) {
              loc = await ipPromise;
            }
            if (!loc) throw new Error('Geo unavailable');
            await fetchOpenMeteo(loc.lat, loc.lon, loc.city, src);
          };
          await withTimeout(runPipeline(), 4500, 'Weather timeout');
          if (reqId !== weatherReqSeq) return;
          syncUI();
          if (!silent) {
            const w = state.weather;
            showToast(t('toastWxSynced', w.city || t('wxLocalPos'), getWeatherDescText(w), w.windMs.toFixed(1)), 2400);
          }
        } catch (_) {
          if (reqId !== weatherReqSeq) return;
          state.weather.loaded = false;
          state.weather.loading = false;
          state.weather.city = state.weatherCityMode === 'custom' ? (state.customCityName || '') : '';
          state.weather.error = t('wxUnavailableDetail');
          syncUI();
          if (!silent) showToast(t('toastWxFail'), 2200);
        }
      }
