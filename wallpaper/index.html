      class StochasticWindEngine {
        constructor() { this.reset(); }
        reset() {
          this.ouMs = 1.6;
          this.gusts = [];
          this.nextGustIn = 1.8;
          this.envVal = 0.72;
          this.envTarget = 0.85;
          this.envTimer = 3.2;
          this.smoothedMs = 1.6;
        }
        update(dt, meanMs, gustStrengthMs, maxCapMs) {
          const cap = Math.max(0.5, maxCapMs);
          if (meanMs <= 0.05 && gustStrengthMs <= 0.05) {
            this.smoothedMs += (0 - this.smoothedMs) * Math.min(1, dt * 2.4);
            return this.smoothedMs;
          }
          // Multi-timescale lull / surge breathing envelope (calm pauses alternating with breezy swells)
          this.envTimer -= dt;
          if (this.envTimer <= 0) {
            const isLull = Math.random() < 0.42;
            this.envTarget = isLull ? (0.22 + Math.random() * 0.30) : (0.88 + Math.random() * 0.47);
            this.envTimer = 3.5 + Math.random() * 5.0;
          }
          this.envVal += (this.envTarget - this.envVal) * (1.0 - Math.exp(-dt * 0.55));
          const dynamicMean = meanMs * this.envVal;

          const sigma = 0.48 + gustStrengthMs * 0.42;
          this.ouMs = clamp(
            this.ouMs + 0.30 * (dynamicMean - this.ouMs) * dt + sigma * Math.sqrt(dt) * randGaussian(),
            -meanMs * 0.45 - 0.8,
            meanMs * 2.15 + 1.8
          );

          this.nextGustIn -= dt;
          if (this.nextGustIn <= 0 && gustStrengthMs > 0.12) {
            const duration = 2.4 + Math.random() * 4.2;
            const isEddy = Math.random() < 0.18;
            const peak = (0.45 + Math.random() * 1.15) * gustStrengthMs * (isEddy ? -0.55 : 1.0);
            this.gusts.push({ age: 0, duration, peak });
            // Occasional quick follow-up ripple surge when a real wind gust hits
            if (!isEddy && Math.random() < 0.38) {
              this.gusts.push({ age: -0.7 - Math.random() * 0.6, duration: 2.0 + Math.random() * 2.2, peak: peak * (0.45 + Math.random() * 0.35) });
            }
            const lullDelay = this.envTarget < 0.6 ? 1.45 : 0.88;
            this.nextGustIn = (2.2 + Math.random() * 5.8) * lullDelay * (1.10 / (0.45 + Math.min(1.6, gustStrengthMs * 0.25)));
          }

          let gustSum = 0;
          for (let i = this.gusts.length - 1; i >= 0; i--) {
            const g = this.gusts[i];
            g.age += dt;
            if (g.age >= g.duration) { this.gusts.splice(i, 1); continue; }
            if (g.age < 0) continue;
            // Asymmetric gust wave: crisp front edge, lingering tail
            const u = g.age / g.duration;
            const shape = u < 0.28
              ? smoothstep(0.0, 0.28, u)
              : Math.exp(-(u - 0.28) / 0.32) * (1.0 - smoothstep(0.84, 1.0, u));
            gustSum += g.peak * shape;
          }

          const softCap = cap * 1.12;
          const targetWind = softCap * Math.tanh((this.ouMs + gustSum) / softCap);
          const rate = targetWind > this.smoothedMs ? 5.2 : 2.1;
          this.smoothedMs += (targetWind - this.smoothedMs) * Math.min(1.0, dt * rate);
          return this.smoothedMs;
        }
      }

      class BotanicalTreeScene {
        constructor(size) {
          this.size = size;
          this.nearCanvas = document.createElement('canvas');
          this.nearCanvas.width = size; this.nearCanvas.height = size;
          this.nearCtx = this.nearCanvas.getContext('2d', { alpha: true });

          this.farCanvas = document.createElement('canvas');
          this.farCanvas.width = size; this.farCanvas.height = size;
          this.farCtx = this.farCanvas.getContext('2d', { alpha: true });

          this.nearRoots = []; this.farRoots = []; this.drifters = [];
          this.season = 'autumn'; this.density = 0.68;
        }

        rebuild(season, seed, density = 0.68) {
          this.season = season; this.density = clamp(density, 0.35, 1.35);
          this.nearRoots = []; this.farRoots = []; this.drifters = [];

          const baseSeed = (seed ^ (season.charCodeAt(0) * 104729 + season.charCodeAt(1) * 7919)) >>> 0;
          const rng = createRng(baseSeed);
          const S = this.size, dScale = this.density;

          const cfg = {
            spring: { maxDepth: 3, scale: 0.96, thick: 0.80, curl: 0.35, clusters: 0.88 * dScale },
            summer: { maxDepth: 3, scale: 0.98, thick: 0.94, curl: 0.28, clusters: 1.18 * dScale },
            autumn: { maxDepth: 3, scale: 0.98, thick: 0.86, curl: 0.42, clusters: 0.92 * dScale },
            winter: { maxDepth: 4, scale: 0.96, thick: 0.82, curl: 0.48, clusters: 0.18 * dScale }
          }[season];

          const nearSpecs = [
            { x: 0.02, y: 0.86, a: -0.52,           len: 0.310, w: 0.024 },
            { x: 0.02, y: 0.36, a: -0.18,           len: 0.280, w: 0.021 },
            { x: 0.98, y: 0.76, a: -Math.PI * 0.80, len: 0.285, w: 0.022 },
            { x: 0.84, y: 0.02, a:  Math.PI * 0.68, len: 0.245, w: 0.018 }
          ];

          nearSpecs.forEach((sp, idx) => {
            this.nearRoots.push(this._buildBranch(rng, {
              x: S * (sp.x + (rng() - 0.5) * 0.025), y: S * (sp.y + (rng() - 0.5) * 0.04),
              angle: sp.a + (rng() - 0.5) * 0.12,
              length: S * sp.len * (0.94 + rng() * 0.12) * cfg.scale * mix(0.86, 1.12, (dScale - 0.35)),
              width: S * sp.w * cfg.thick, depth: 0, maxDepth: cfg.maxDepth,
              season, cfg, isFar: false, ornSeed: (baseSeed + idx * 7919 + 13) >>> 0
            }));
          });

          const farSpecs = [
            { x: 0.02, y: 0.68, a: -0.28,           len: 0.275 },
            { x: 0.98, y: 0.54, a:  Math.PI * 1.06, len: 0.270 },
            { x: 0.66, y: 0.02, a:  Math.PI * 0.60, len: 0.235 },
            { x: 0.34, y: 0.98, a: -Math.PI * 0.56, len: 0.225 }
          ];

          farSpecs.forEach((sp, idx) => {
            this.farRoots.push(this._buildBranch(rng, {
              x: S * (sp.x + (rng() - 0.5) * 0.03), y: S * (sp.y + (rng() - 0.5) * 0.03),
              angle: sp.a + (rng() - 0.5) * 0.14,
              length: S * sp.len * (0.93 + rng() * 0.12) * mix(0.85, 1.10, (dScale - 0.35)),
              width: S * 0.0175 * cfg.thick, depth: 0, maxDepth: Math.max(2, cfg.maxDepth - 1),
              season, cfg, isFar: true, ornSeed: (baseSeed + idx * 104729 + 577) >>> 0
            }));
          });

          if (season === 'spring') {
            for (let i = 0; i < 14; i++) this.drifters.push({ kind: 'petal', x: S * (0.08 + rng() * 0.84), y: S * (0.08 + rng() * 0.84), vx: 9 + rng() * 15, vy: 13 + rng() * 17, rot: rng() * Math.PI * 2, rotSpeed: (rng() - 0.5) * 1.9, size: S * (0.0058 + rng() * 0.0038), phase: rng() * Math.PI * 2 });
          } else if (season === 'autumn') {
            for (let i = 0; i < 8; i++) this.drifters.push({ kind: 'maple', x: S * (0.08 + rng() * 0.84), y: S * (0.08 + rng() * 0.84), vx: 7 + rng() * 12, vy: 15 + rng() * 19, rot: rng() * Math.PI * 2, rotSpeed: (rng() - 0.5) * 1.5, size: S * (0.018 + rng() * 0.009), phase: rng() * Math.PI * 2 });
          }
        }

        _buildBranch(rng, opts) {
          const { x, y, angle, length, width, depth, maxDepth, season, cfg, isFar, ornSeed } = opts;
          const bend = (rng() - 0.5) * length * cfg.curl * (depth === 0 ? 0.8 : 1.15);
          const inertia = Math.pow(0.45, depth) * 1.9 + 0.15;
          const stiffness = 6.2 + depth * 4.8 + rng() * 1.8;
          const damping = (2.0 + depth * 0.85) * Math.sqrt(inertia * stiffness) * 0.42;

          const node = {
            x, y, baseAngle: angle, length, width,
            tipWidth: Math.max(1.1, width * (depth >= maxDepth - 1 ? 0.34 : 0.60)),
            bend, depth, isFar, angleOffset: 0, angVel: 0,
            inertia, stiffness, damping,
            windGain: (0.052 + depth * 0.055) * (0.85 + rng() * 0.35),
            spatialPhase: (x + y * 0.65) * 0.0055 + rng() * 1.8,
            flutterFreq: 2.3 + depth * 1.35 + rng() * 1.5,
            children: [], ornaments: []
          };

          this._populateOrnaments(createRng(ornSeed), node, season, cfg, isFar);

          if (depth < maxDepth) {
            const numChildren = depth === 0
              ? (season === 'winter' ? 3 : 2 + (rng() > 0.45 ? 1 : 0))
              : (depth === 1 ? (2 + (rng() > 0.55 ? 1 : 0)) : (season === 'winter' ? 2 : (rng() > 0.42 ? 2 : 1)));

            for (let i = 0; i < numChildren; i++) {
              const tPos = i === numChildren - 1 ? 0.96 : (0.42 + (i / Math.max(1, numChildren - 1)) * 0.48 + (rng() - 0.5) * 0.08);
              const side = (i % 2 === 0 ? 1 : -1) * (rng() > 0.14 ? 1 : -1);
              const spread = (season === 'winter' ? 0.46 : 0.38) + rng() * 0.34;
              const childRelAngle = (i === numChildren - 1 && numChildren > 1) ? (rng() - 0.5) * 0.32 : side * spread;
              const lenDecay = (0.62 + rng() * 0.15) * (tPos < 0.7 ? 0.85 : 1.0);

              const child = this._buildBranch(rng, {
                x: 0, y: 0, angle: childRelAngle, length: length * lenDecay,
                width: node.tipWidth * (0.84 + rng() * 0.16), depth: depth + 1, maxDepth,
                season, cfg, isFar, ornSeed: (ornSeed * 1664525 + i * 1013904223 + depth * 31) >>> 0
              });
              child.attachT = clamp(tPos, 0.30, 0.99);
              if (depth >= 2 && this.density < 0.58 && i > 0) continue;
              node.children.push(child);
            }
          }
          return node;
        }

        _populateOrnaments(rng, node, season, cfg, isFar) {
          const S = this.size, d = node.depth;
          if (d === 0 && season !== 'summer') return;
          if (d === 0 && rng() > 0.20) return;

          if (season === 'summer') {
            const count = Math.round((d === 0 ? 1 : (d === 1 ? 4 : 7)) * cfg.clusters * (isFar ? 0.86 : 0.88));
            for (let i = 0; i < count; i++) {
              const t = 0.30 + (i / Math.max(1, count)) * 0.72 + (rng() - 0.5) * 0.08;
              const sz = S * (0.020 + rng() * 0.014) * (isFar ? 1.06 : 1.0);
              node.ornaments.push({ kind: 'broadleaf', t: clamp(t, 0.22, 1.02), relAngle: (i % 2 === 0 ? 1 : -1) * (0.42 + rng() * 0.72), len: sz * (1.58 + rng() * 0.40), wid: sz * (0.46 + rng() * 0.16), petiole: sz * 0.28, flutterPhase: rng() * Math.PI * 2, flutterAmp: 0.055 + rng() * 0.075 });
            }
          } else if (season === 'spring') {
            const count = Math.round((d === 1 ? 3 : 5) * cfg.clusters * (isFar ? 0.88 : 0.92));
            for (let i = 0; i < count; i++) {
              const t = 0.30 + (i / Math.max(1, count)) * 0.72 + (rng() - 0.5) * 0.1;
              const isBlossom = rng() < 0.70, sz = S * (isBlossom ? (0.0135 + rng() * 0.009) : (0.014 + rng() * 0.008));
              node.ornaments.push({ kind: isBlossom ? 'blossom' : 'youngleaf', t: clamp(t, 0.22, 1.02), relAngle: (rng() > 0.5 ? 1 : -1) * (0.35 + rng() * 0.85), len: sz * 1.42, wid: sz * 0.42, radius: sz, petiole: sz * 0.45, rot: rng() * Math.PI * 2, flutterPhase: rng() * Math.PI * 2, flutterAmp: 0.075 + rng() * 0.095 });
            }
          } else if (season === 'autumn') {
            const count = Math.round((d === 1 ? 2 : 4) * cfg.clusters * (isFar ? 0.86 : 0.90));
            for (let i = 0; i < count; i++) {
              const t = 0.30 + (i / Math.max(1, count)) * 0.72 + (rng() - 0.5) * 0.1;
              const sz = S * (0.025 + rng() * 0.015) * (isFar ? 1.04 : 1.0);
              node.ornaments.push({ kind: 'maple', t: clamp(t, 0.22, 1.03), relAngle: (i % 2 === 0 ? 1 : -1) * (0.46 + rng() * 0.74), radius: sz, petiole: sz * 0.42, flutterPhase: rng() * Math.PI * 2, flutterAmp: 0.065 + rng() * 0.085 });
            }
          } else if (season === 'winter' && d >= 2) {
            const count = Math.max(1, Math.round((2 + Math.floor(rng() * 3)) * this.density));
            for (let i = 0; i < count; i++) {
              const isDryLeaf = d >= 3 && rng() < 0.14;
              node.ornaments.push({ kind: isDryLeaf ? 'dryleaf' : 'bud', t: 0.35 + rng() * 0.65, relAngle: (rng() > 0.5 ? 1 : -1) * (0.45 + rng() * 0.45), len: S * (isDryLeaf ? 0.017 : 0.007), wid: S * (isDryLeaf ? 0.006 : 0.003), flutterPhase: rng() * Math.PI * 2, flutterAmp: isDryLeaf ? 0.13 : 0.02 });
            }
          }
        }

        updatePhysics(dt, windMs, elapsed) {

          : (lang === 'en' ? `Base ${state.baseWindMs.toFixed(1)} · Gust ${state.liveWindMs.toFixed(1)} m/s` : `基准 ${state.baseWindMs.toFixed(1)} · 瞬时 ${state.liveWindMs.toFixed(1)} m/s`);

        quickTimeBtns.forEach(b => {

      }

      const windEngine      = new StochasticWindEngine();
      const cloudEngine     = new PassingCloudEngine();
      const birdEngine      = new SmoothBirdFlightEngine();
      const rainEngine      = new GlassRainEngine(1024);
      const lightningEngine = new ThunderLightningEngine();
      const treeScene       = new BotanicalTreeScene(1024);
      let sceneAssetsPrepared = false;
      let treeRenderAccum = 0, treeForceRender = true;
      let rainRenderAccum = 0, rainForceRender = true;

      function prepareSceneAssets() {
        treeScene.rebuild(getActiveSeason(), state.treeSeed, state.foliageDensity);
        for (let i = 0; i < 6; i++) {
          state.simElapsed += 0.016;
          treeScene.updatePhysics(0.016, windEngine.update(0.016, state.damped.windMeanMs, state.damped.gustStrengthMs, 10.5), state.simElapsed);
        }
        treeScene.render(state.simElapsed, windEngine.smoothedMs);
        treeRenderAccum = 0; treeForceRender = false;
        if (state.damped.rainAmt > 0.5 || state.damped.snowAmt > 0.5) {
          rainEngine.update(0.016, state.damped.rainAmt, state.damped.rainIntensity, state.damped.snowAmt, state.damped.snowIntensity, windEngine.smoothedMs, true);
          rainRenderAccum = 0; rainForceRender = false;

      let idleTimer = null, lastMouse = { x: -1, y: -1 }, isSoftFullscreenHidden = false;
      function getNativeFullscreenEl() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
      function inFullscreen() { return Boolean(getNativeFullscreenEl() || isSoftFullscreenHidden); }
      function syncFullscreenButton() {
        const fs = inFullscreen();
        const label = fs ? t('fullscreenExit') : t('fullscreenEnter');

        btnFullscreen.title = title;
        btnFullscreen.setAttribute('aria-label', label);
      }
      function syncPanelButtons() {
        const open = Boolean(state.isPanelOpen);
        if (btnPreview) btnPreview.classList.toggle('is-active', !open);
        btnPanel.classList.toggle('is-open', open);
        btnPanelLabel.textContent = t('panelBtn');
        btnPanel.title = t('panelBtnTitle');
        btnPanel.setAttribute('aria-label', t('panelBtn'));
      }
      function setPanelOpen(open) {
        state.isPanelOpen = open;
        sidePanel.classList.toggle('open', open);
        syncPanelButtons();
        if (open) {
          topToolbar.classList.remove('ui-hidden', 'ui-dim');
          document.body.classList.remove('cursor-none');
          clearTimeout(idleTimer);
        } else {
          hideCityResults();
          scheduleIdleBehavior();
        }
      }
      function syncPauseButton() {
        iconPause.classList.toggle('hidden', state.isPaused);
        iconPlay.classList.toggle('hidden', !state.isPaused);
        const title = state.isPaused ? t('playTitle') : t('pauseTitle');
        btnPause.title = title;
        btnPause.setAttribute('aria-label', title);
      }
      function setPaused(paused, announce = false) {
        state.isPaused = paused;
        syncPauseButton();
        if (announce) showToast(state.isPaused ? t('toastPaused') : t('toastResumed'), 1400);
      }
      function scheduleIdleBehavior() {
        clearTimeout(idleTimer); if (state.isPanelOpen) return;
        idleTimer = setTimeout(() => {
          if (state.isPanelOpen) return;
          if (inFullscreen()) {
            topToolbar.classList.add('ui-hidden');
            document.body.classList.add('cursor-none');
          } else topToolbar.classList.add('ui-dim');
        }, 2800);
      }
      function wakeUI() {
        if (window.location.search.indexOf('desktop=1') !== -1 || state.isPanelOpen) return;
        topToolbar.classList.remove('ui-hidden', 'ui-dim'); document.body.classList.remove('cursor-none');
        scheduleIdleBehavior();
      }

      window.addEventListener('mousemove', (e) => {
        if (lastMouse.x === -1) { lastMouse = { x: e.clientX, y: e.clientY }; scheduleIdleBehavior(); return; }
        const dist = Math.hypot(e.clientX - lastMouse.x, e.clientY - lastMouse.y);
        lastMouse = { x: e.clientX, y: e.clientY };
        if (inFullscreen()) {
          if ((e.clientX > window.innerWidth - 280 && e.clientY < 110) || dist > 18) {
            if (isSoftFullscreenHidden && !getNativeFullscreenEl()) { isSoftFullscreenHidden = false; syncFullscreenButton(); }
            wakeUI();
          }
        } else if (dist > 4) wakeUI();
      });
      canvas.addEventListener('click', () => {
        if (state.isPanelOpen) setPanelOpen(false);
        else {
          if (isSoftFullscreenHidden && !getNativeFullscreenEl()) { isSoftFullscreenHidden = false; syncFullscreenButton(); }
          wakeUI();
        }
      });

      function toggleFullscreen() {
        if (!inFullscreen()) {
          const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
          if (req) {
            Promise.resolve(req.call(el)).then(() => {
              setPanelOpen(false); topToolbar.classList.add('ui-hidden');
              document.body.classList.add('cursor-none');
              syncFullscreenButton();
              showToast(t('toastEnterFs'), 2200);
            }).catch(() => {
              setPanelOpen(false); isSoftFullscreenHidden = true; topToolbar.classList.add('ui-hidden');
              document.body.classList.add('cursor-none');
              syncFullscreenButton();
              showToast(t('toastEnterSoftFs'), 2000);
            });
          } else {
            setPanelOpen(false); isSoftFullscreenHidden = true; topToolbar.classList.add('ui-hidden');
            document.body.classList.add('cursor-none');
            syncFullscreenButton();
            showToast(t('toastEnterSoftFs'), 2000);
          }
        } else {
          if (getNativeFullscreenEl()) {
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            if (exit) Promise.resolve(exit.call(document)).catch(() => {});
          }
          isSoftFullscreenHidden = false; syncFullscreenButton(); wakeUI();
        }
      }
      function handleFullscreenChange() {
        if (!getNativeFullscreenEl()) { isSoftFullscreenHidden = false; wakeUI(); }
        syncFullscreenButton();

      document.addEventListener('fullscreenchange', handleFullscreenChange);
      document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

      if (btnPreview) btnPreview.addEventListener('click', () => setPanelOpen(false));
      btnFullscreen.addEventListener('click', toggleFullscreen);
      btnPanel.addEventListener('click', () => setPanelOpen(!state.isPanelOpen));
      btnClosePanel.addEventListener('click', () => setPanelOpen(false));
      btnPause.addEventListener('click', () => setPaused(!state.isPaused, true));

      function rebuildAndRenderTree() {
        treeScene.rebuild(getActiveSeason(), state.treeSeed, state.foliageDensity);

      langBtns.forEach(b => b.addEventListener('click', () => {

      mullionBtns.forEach(b => b.addEventListener('click', () => {

          if (!state.weather.loaded && !state.weather.loading) {

          }
          showToast(t('toastWmodeLive'), 1800);
        } else {
          if (state.manualWeatherType === 'thunder') lightningEngine.nextFlashIn = 0.85;
          showToast(t('toastWmodeManual'), 1800);
        }
        syncUI(); scheduleSaveConfig();
      }));

      weatherTypeBtns.forEach(b => b.addEventListener('click', () => {
        if (state.weatherMode === 'off' || (state.weatherMode === 'live' && state.weather.loaded)) return;
        state.manualWeatherType = b.dataset.wtype;
        if (state.manualWeatherType === 'thunder') lightningEngine.nextFlashIn = 0.85;
        syncUI(); scheduleSaveConfig();
        const label = WEATHER_TYPE_META[state.manualWeatherType]?.[getActiveLang()]?.label || '';
        showToast(t('toastWtype', label), 1600);
      }));

      fpsBtns.forEach(b => b.addEventListener('click', () => {
        state.fpsCap = Number(b.dataset.fps); syncUI(); scheduleSaveConfig();

      const UNIFORM_KEYS = [
        'resolution', 'time', 'texNear', 'texFar', 'texRain', 'texBird',
        'halfSpanX', 'W', 'winSide', 'winRect', 'treeDepths', 'mullionMode',
        'r', 's', 'beamFade', 'beamColor', 'beamPower', 'isMoon', 'sunsetHeat', 'dawnWarmth', 'sunsetDrama',

      let gl = null;
      let parallelExt = null;
      let program = null;
      let u = {};
      let sharedVs = null;
      let quadBuf = null;
      let texNear = null, texFar = null, texRain = null, texBird = null;
      let rawVsSource = null, rawFsSource = null;
      const programCache = new Map();
      let activeBuildToken = 0;
      let pendingBuild = null;
      let prewarmBuild = null;
      let prewarmTimer = null;
      let prewarmRunning = false;
      let isContextLost = false;

      function createDynamicTexture(unit, srcCanvas) {
        const tex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, srcCanvas);
        return tex;
      }

      function compileShaderDeferred(type, src) {
        const sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        return sh;
      }

      function ensureSharedResources() {
        if (!rawVsSource) rawVsSource = $('vs-source').textContent;
        if (!rawFsSource) rawFsSource = $('fs-source').textContent;
        if (!sharedVs) sharedVs = compileShaderDeferred(gl.VERTEX_SHADER, rawVsSource);
        if (!quadBuf) {
          quadBuf = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        }
      }

      function ensureTexturesUploaded() {
        if (!gl || isContextLost) return;
        if (!texNear) texNear = createDynamicTexture(0, treeScene.nearCanvas);
        if (!texFar)  texFar  = createDynamicTexture(1, treeScene.farCanvas);
        if (!texRain) texRain = createDynamicTexture(2, rainEngine.canvas);
        if (!texBird) texBird = createDynamicTexture(3, birdEngine.canvas);
      }

      function cleanupBuild(b) {
        if (!b || !gl) return;
        try { if (b.fs) gl.deleteShader(b.fs); } catch (_) {}
        try { if (b.program) gl.deleteProgram(b.program); } catch (_) {}
      }

      function activateProgramEntry(entry) {
        if (!entry || !gl || isContextLost) return;
        program = entry.program;
        u = entry.u;
        gl.useProgram(program);
        if (quadBuf) {
          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
          const posLoc = entry.posLoc >= 0 ? entry.posLoc : gl.getAttribLocation(program, 'a_position');
          if (posLoc >= 0) {
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
          }
        }
        gl.uniform1i(u.texNear, 0); gl.uniform1i(u.texFar, 1);
        gl.uniform1i(u.texRain, 2); gl.uniform1i(u.texBird, 3);
        updateRoomGeometry();
      }

      function startProgramBuild(mode) {
        ensureSharedResources();
        const modeKey = clamp(Math.round(Number(mode) || 0), 0, 9);
        const fs = compileShaderDeferred(gl.FRAGMENT_SHADER, `#define ACTIVE_MULLION ${modeKey}\n` + rawFsSource);
        const prog = gl.createProgram();
        gl.attachShader(prog, sharedVs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        return { mode: modeKey, program: prog, fs };
      }

      function finalizeProgramBuild(build, activate = true) {
        if (!gl || isContextLost) {
          cleanupBuild(build);
          return null;
        }
        const linked = gl.getProgramParameter(build.program, gl.LINK_STATUS);
        if (!linked) {
          const vsOk = sharedVs ? gl.getShaderParameter(sharedVs, gl.COMPILE_STATUS) : true;
          const fsOk = gl.getShaderParameter(build.fs, gl.COMPILE_STATUS);
          let errMsg = '';
          if (!vsOk) errMsg = gl.getShaderInfoLog(sharedVs) || 'Vertex shader error';
          else if (!fsOk) errMsg = gl.getShaderInfoLog(build.fs) || 'Fragment shader error';
          else errMsg = gl.getProgramInfoLog(build.program) || 'Program link error';
          cleanupBuild(build);
          throw new Error(errMsg);
        }
        gl.detachShader(build.program, build.fs);
        gl.deleteShader(build.fs);
        build.fs = null;

        const locs = {};
        UNIFORM_KEYS.forEach(k => { locs[k] = gl.getUniformLocation(build.program, 'u_' + k); });
        const entry = {
          mode: build.mode,
          program: build.program,
          u: locs,
          posLoc: gl.getAttribLocation(build.program, 'a_position')
        };
        programCache.set(build.mode, entry);
        if (activate) activateProgramEntry(entry);
        return entry;
      }

      function cancelPrewarm() {
        if (prewarmTimer) { clearTimeout(prewarmTimer); prewarmTimer = null; }
        if (prewarmBuild) { cleanupBuild(prewarmBuild); prewarmBuild = null; }
        prewarmRunning = false;
      }

      function schedulePrewarmMullions(delayMs = 600) {
        if (isDirectorMode || !parallelExt || !gl || isContextLost) return;
        if (prewarmTimer) { clearTimeout(prewarmTimer); prewarmTimer = null; }
        if (prewarmRunning) return;
        const stepPrewarm = () => {
          prewarmTimer = null;
          if (isDirectorMode || !gl || isContextLost || !parallelExt) {
            prewarmRunning = false;
            return;
          }
          if (document.hidden || hostSuspended || pendingBuild) {
            prewarmRunning = false;
            prewarmTimer = setTimeout(() => schedulePrewarmMullions(200), 200);
            return;
          }
          let nextMode = -1;
          for (let m = 0; m <= 9; m++) {
            if (!programCache.has(m)) { nextMode = m; break; }
          }
          if (nextMode < 0) {
            prewarmRunning = false;
            return;
          }
          prewarmRunning = true;
          try {
            prewarmBuild = startProgramBuild(nextMode);
          } catch (_) {
            prewarmRunning = false;
            return;
          }
          const pollPrewarm = () => {
            if (!prewarmBuild || !gl || isContextLost) {
              prewarmRunning = false;
              return;
            }
            let done = false;
            try {
              done = Boolean(gl.getProgramParameter(prewarmBuild.program, parallelExt.COMPLETION_STATUS_KHR));
            } catch (_) {
              cleanupBuild(prewarmBuild);
              prewarmBuild = null;
              prewarmRunning = false;
              return;
            }
            if (!done) {
              prewarmTimer = setTimeout(pollPrewarm, 40);
              return;
            }
            const finished = prewarmBuild;
            prewarmBuild = null;
            prewarmRunning = false;
            try {
              finalizeProgramBuild(finished, false);
            } catch (_) {}
            schedulePrewarmMullions(40);
          };
          prewarmTimer = setTimeout(pollPrewarm, 40);
        };
        prewarmTimer = setTimeout(stepPrewarm, delayMs);
      }

      function ensureProgramForMode(mode, sync = false) {
        if (!gl || isContextLost) return Promise.resolve(null);
        const modeKey = clamp(Math.round(Number(mode) || 0), 0, 9);
        const cached = programCache.get(modeKey);
        if (cached) {
          if (pendingBuild) {
            activeBuildToken++;
            cleanupBuild(pendingBuild);
            pendingBuild = null;
          }
          activateProgramEntry(cached);
          return Promise.resolve(cached);
        }
        if (pendingBuild && pendingBuild.mode === modeKey && !sync) {
          return pendingBuild.promise;
        }
        if (pendingBuild) {
          activeBuildToken++;
          cleanupBuild(pendingBuild);
          pendingBuild = null;
        }

        if (prewarmTimer) { clearTimeout(prewarmTimer); prewarmTimer = null; }
        prewarmRunning = false;
        let adoptedPrewarm = null;
        if (prewarmBuild) {
          if (prewarmBuild.mode === modeKey) {
            adoptedPrewarm = prewarmBuild;
            prewarmBuild = null;
          } else {
            cleanupBuild(prewarmBuild);
            prewarmBuild = null;
          }
        }

        const token = ++activeBuildToken;
        const build = adoptedPrewarm || startProgramBuild(modeKey);
        if (sync || !parallelExt) {
          const entry = finalizeProgramBuild(build, true);
          schedulePrewarmMullions(600);
          return Promise.resolve(entry);
        }

        const promise = new Promise((resolve, reject) => {
          const startTs = performance.now();
          const poll = () => {
            if (token !== activeBuildToken || isContextLost) {
              cleanupBuild(build);
              resolve(null);
              return;
            }
            let done = false;
            try {
              done = Boolean(gl.getProgramParameter(build.program, parallelExt.COMPLETION_STATUS_KHR));
            } catch (err) {
              cleanupBuild(build);
              if (pendingBuild && pendingBuild.token === token) pendingBuild = null;
              reject(err);
              return;
            }
            if (done) {
              try {
                const entry = finalizeProgramBuild(build, true);
                if (pendingBuild && pendingBuild.token === token) pendingBuild = null;
                schedulePrewarmMullions(600);
                resolve(entry);
              } catch (err) {
                if (pendingBuild && pendingBuild.token === token) pendingBuild = null;
                reject(err);
              }
              return;
            }
            if (performance.now() - startTs > 20000) {
              cleanupBuild(build);
              if (pendingBuild && pendingBuild.token === token) pendingBuild = null;
              reject(new Error('Shader compile timeout'));
              return;
            }
            requestAnimationFrame(poll);
          };
          requestAnimationFrame(poll);
        });
        pendingBuild = { token, mode: modeKey, program: build.program, fs: build.fs, promise };
        return promise;
      }

      function acquireWebGLContext() {
        if (gl) return gl;
        gl = canvas.getContext('webgl', { antialias: false, depth: false, stencil: false, preserveDrawingBuffer: isDirectorMode, powerPreference: 'high-performance' })

      canvas.addEventListener('webglcontextrestored', () => {

          texNear = null; texFar = null; texRain = null; texBird = null;
          program = null; u = {};
          pendingBuild = null;
          isContextLost = false;
          state.lastRenderTs = 0;
          treeForceRender = true;
          rainForceRender = true;
          ensureProgramForMode(state.mullionMode, true);
          treeScene.render(state.simElapsed, windEngine.smoothedMs);
          treeRenderAccum = 0;
          treeForceRender = false;
          ensureTexturesUploaded();
          resizeCanvas();
          schedulePrewarmMullions(800);
        } catch (err) { showFallback(t('webglFailDesc')); }

      function uploadSubCanvas(unit, tex, srcCanvas) {
        if (!gl || isContextLost || !tex) return;
        gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, srcCanvas);
      }

      function updateRoomGeometry() {
        const aspect = canvas.width / Math.max(canvas.height, 1);
        const narrowZoom = aspect < 1.0 ? (1.0 / Math.max(aspect, 0.45)) : 1.0;
        const halfSpanX = aspect * narrowZoom, W = halfSpanX + 0.30;
        const zCenter = 0.84 * W, zWidth = 0.46 * W * state.windowSize;
        const yCenter = 0.320 * W, yHeight = 0.96 * state.windowSize;
        state.roomGeom = { W, zCenter, zWidth, yCenter, yHeight };
        if (!gl || isContextLost || !program) return;
        gl.uniform1f(u.halfSpanX, halfSpanX);
        gl.uniform1f(u.W, W);
        gl.uniform4f(u.winRect, zCenter, zWidth, yCenter, yHeight);
        gl.uniform2f(u.treeDepths, 0.68 * W, 1.55 * W);
      }

      function resizeCanvas() {
        const dpr = isDesktopWallpaperMode
          ? Math.min(window.devicePixelRatio || 1, 1.25)
          : Math.min(window.devicePixelRatio || 1, 2.0);
        let w = Math.max(1, Math.floor(window.innerWidth * dpr));
        let h = Math.max(1, Math.floor(window.innerHeight * dpr));
        if (isDesktopWallpaperMode) {
          const maxPixels = 3840 * 2160;
          if (w * h > maxPixels) {
            const scale = Math.sqrt(maxPixels / (w * h));
            w = Math.max(1, Math.floor(w * scale));
            h = Math.max(1, Math.floor(h * scale));
          }
        }
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w; canvas.height = h;
          if (gl && !isContextLost) gl.viewport(0, 0, w, h);
        } else if (gl && !isContextLost) {
          gl.viewport(0, 0, w, h);
        }
        updateRoomGeometry();
      }
      window.addEventListener('resize', resizeCanvas);

      document.addEventListener('visibilitychange', () => {

      function getTargetEnvironment() {
        if (state.weatherMode === 'off') {
          return {
            targetMeanMs: 1.6, targetGustMs: 1.4, targetWindCap: 6.5,
            targetCloudPct: 16.0, targetCloudSoft: 1.0 + 0.16 * 0.48,
            targetRain: 0.0, targetThunder: 0.0, targetSnow: 0.0,
            targetRainInt: state.rainIntensity, targetSnowInt: state.rainIntensity
          };
        }
        let type, precipInt, targetMeanMs, targetGustMs, targetCloudPct, targetWindCap;
        if (state.weatherMode === 'live' && state.weather.loaded) {
          const w = state.weather;
          type = w.weatherType;
          precipInt = type === 'clear' ? 0.55 : w.livePrecipIntensity;
          targetMeanMs = Math.max(0, w.windMs);
          targetGustMs = Math.max(0.6, w.gustMs - targetMeanMs * 0.45);
          targetCloudPct = clamp(w.cloudPct, 0, 100);
          targetWindCap = clamp(Math.max(8.5, w.gustMs * 1.15), 8.5, 16.0);
        } else {
          type = state.manualWeatherType;
          precipInt = state.rainIntensity;
          const stormWindFloor = type === 'thunder' ? Math.max(state.baseWindMs, 3.8) : state.baseWindMs;
          targetMeanMs = stormWindFloor;
          targetGustMs = Math.max(0.6, stormWindFloor * (type === 'thunder' ? 1.15 : 0.85) + (type === 'thunder' ? 1.8 : 0.8));
          targetCloudPct = type === 'thunder' ? 95.0 : (type === 'snow' ? 86.0 : (type === 'rain' ? 80.0 : 18.0));
          targetWindCap = type === 'thunder' ? 12.5 : 10.5;
        }

        const targetRain    = (type === 'rain' || type === 'thunder') ? 1.0 : 0.0;
        const targetThunder = type === 'thunder' ? 1.0 : 0.0;
        const targetSnow    = type === 'snow' ? 1.0 : 0.0;
        const targetRainInt = type === 'thunder' ? clamp(precipInt * 1.12, 0.45, 1.35) : clamp(precipInt, 0.30, 1.35);
        const targetSnowInt = clamp(precipInt, 0.30, 1.35);
        return {
          targetMeanMs, targetGustMs, targetWindCap, targetCloudPct,
          targetCloudSoft: 1.0 + (targetCloudPct / 100.0) * 0.48,
          targetRain, targetThunder, targetSnow, targetRainInt, targetSnowInt
        };
      }

      function drawWebGLFrame(cel) {
        if (!gl || isContextLost || !program) return;
        const totalPenScale = (1.0 / clamp(state.damped.sharpness, 0.40, 1.65)) * state.damped.cloudSoft * cloudEngine.penumbraBoost;

        gl.uniform2f(u.resolution, canvas.width, canvas.height);
        gl.uniform1f(u.time, state.simElapsed);
        gl.uniform1f(u.winSide, cel.winSide);
        gl.uniform1f(u.mullionMode, state.mullionMode);
        gl.uniform1f(u.r, cel.r);
        gl.uniform1f(u.s, cel.s);
        gl.uniform1f(u.beamFade, cel.beamFade);
        gl.uniform3fv(u.beamColor, cel.beamColor);
        gl.uniform1f(u.beamPower, cel.beamPower);
        gl.uniform1f(u.isMoon, cel.isMoon);
        gl.uniform1f(u.sunsetHeat, cel.sunsetHeat);
        gl.uniform1f(u.dawnWarmth, cel.dawnWarmth);
        gl.uniform1f(u.sunsetDrama, state.sunsetDrama);
        gl.uniform1f(u.penScale, totalPenScale);
        gl.uniform1f(u.wallMat, state.wallMat);
        gl.uniform1f(u.wallTex, state.wallTex);
        gl.uniform2f(u.rainParams, state.damped.rainAmt, state.damped.rainIntensity);
        gl.uniform3f(u.weatherFx, state.damped.thunderAmt, state.damped.snowAmt, state.damped.snowIntensity);
        gl.uniform4fv(u.lightning, lightningEngine.uniform);
        gl.uniform1f(u.windMs, windEngine.smoothedMs);
        gl.uniform1f(u.dustOn, state.dustEnabled ? 1.0 : 0.0);
        gl.uniform4fv(u.bird0, birdEngine.rect0);
        gl.uniform4fv(u.bird1, birdEngine.rect1);
        gl.uniform2fv(u.birdBlur, birdEngine.blur);
        gl.uniform3fv(u.ambientCol, cel.ambientCol);
        gl.uniform3fv(u.leftGlowCol, cel.leftGlowCol);
        gl.uniform3fv(u.rightGlowCol, cel.rightGlowCol);
        gl.uniform3fv(u.horizonGlowCol, cel.horizonGlowCol);

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      let uiAccum = 0;
      function updateTelemetry(activeHour, cel) {
        const lang = getActiveLang();
        const timeStr = formatHour(activeHour);
        if (lastTelemetry.time !== timeStr) {
          lastTelemetry.time = timeStr;
          valTime.textContent = timeStr;
        }
        if (lastTelemetry.phase !== cel.phaseLabel) {
          lastTelemetry.phase = cel.phaseLabel;
          valPhase.textContent = cel.phaseLabel;
        }
        if (state.isPanelOpen && state.manualTuning && activeTabId === 'light' && state.timeMode !== 'manual' && !panelScrolling && document.activeElement !== sliders.hour) {
          const hourVal = activeHour.toFixed(2);
          if (lastTelemetry.hourVal !== hourVal) {
            lastTelemetry.hourVal = hourVal;
            sliders.hour.value = hourVal;
            updateRangeFill(sliders.hour);
          }
        }
        const cloudTxt = !state.passingClouds ? t('cloudOff') : (cloudEngine.dipAmount > 0.14 ? t('cloudPassing') : t('cloudClear'));
        if (lastTelemetry.cloud !== cloudTxt) {
          lastTelemetry.cloud = cloudTxt;
          valCloudLive.textContent = cloudTxt;
        }
        const isLive = state.weatherMode === 'live' && state.weather.loaded;
        const windTxt = !isLive
          ? (lang === 'en' ? `Base ${state.baseWindMs.toFixed(1)} · Gust ${state.liveWindMs.toFixed(1)} m/s` : `基准 ${state.baseWindMs.toFixed(1)} · 瞬时 ${state.liveWindMs.toFixed(1)} m/s`)
          : (lang === 'en' ? `Live ${state.weather.windMs.toFixed(1)} · Gust ${state.liveWindMs.toFixed(1)} m/s` : `实况 ${state.weather.windMs.toFixed(1)} · 瞬时 ${state.liveWindMs.toFixed(1)} m/s`);
        if (lastTelemetry.wind !== windTxt) {
          lastTelemetry.wind = windTxt;
          valWindLive.textContent = windTxt;
        }
      }

      function stepSimulation(dt, renderFrame = true) {
        const dampAlpha = 1.0 - Math.exp(-dt * 1.2), fastAlpha = 1.0 - Math.exp(-dt * 7.5);
        const env = getTargetEnvironment();
        state.damped.cloudPct       += (env.targetCloudPct  - state.damped.cloudPct)       * dampAlpha;
        state.damped.cloudSoft      += (env.targetCloudSoft - state.damped.cloudSoft)      * dampAlpha;
        state.damped.windMeanMs     += (env.targetMeanMs    - state.damped.windMeanMs)     * dampAlpha;
        state.damped.gustStrengthMs += (env.targetGustMs    - state.damped.gustStrengthMs) * dampAlpha;
        state.damped.rainAmt        += (env.targetRain      - state.damped.rainAmt)        * dampAlpha;
        state.damped.thunderAmt     += (env.targetThunder   - state.damped.thunderAmt)     * dampAlpha;
        state.damped.snowAmt        += (env.targetSnow      - state.damped.snowAmt)        * dampAlpha;
        state.damped.rainIntensity  += (env.targetRainInt   - state.damped.rainIntensity)  * fastAlpha;
        state.damped.snowIntensity  += (env.targetSnowInt   - state.damped.snowIntensity)  * fastAlpha;
        state.damped.sharpness      += (state.sharpness     - state.damped.sharpness)      * fastAlpha;

        const activeSeason = getActiveSeason();
        const targetSlopeShift = SEASON_META[activeSeason].slopeShift;
        if (state.damped.slopeShift === null) state.damped.slopeShift = targetSlopeShift;
        else state.damped.slopeShift += (targetSlopeShift - state.damped.slopeShift) * dampAlpha;

        let activeHour = state.hour;
        if (state.timeMode === 'realtime') {
          const d = new Date();
          activeHour = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
          state.hour = activeHour;
        } else if (state.timeMode === 'fullDay' && !state.isPaused) {
          state.hour = (state.hour + (24.0 / 120.0) * state.speed * dt) % 24.0;
          activeHour = state.hour;
        }

        const cel = computeSweepLighting(
          activeHour, activeSeason, state.sunsetDrama, state.damped.cloudSoft,
          cloudEngine.transmittance, state.damped.rainAmt, state.damped.thunderAmt, state.damped.snowAmt,
          state.damped.slopeShift
        );
        state.lastBeamFade = cel.beamFade;
        state.lastWinBounds = computeWallWindowBounds(cel);

        let windMs = windEngine.smoothedMs;
        if (!state.isPaused) {
          state.simElapsed += dt;
          windMs = windEngine.update(dt, state.damped.windMeanMs, state.damped.gustStrengthMs, env.targetWindCap);
          treeScene.updatePhysics(dt, windMs, state.simElapsed);
          treeRenderAccum += dt;
          if (renderFrame && (isDirectorMode || treeForceRender || (cel.beamFade > 0.002 && treeRenderAccum >= 0.04))) {
            treeRenderAccum = 0;
            treeForceRender = false;
            treeScene.render(state.simElapsed, windMs);
            uploadSubCanvas(0, texNear, treeScene.nearCanvas);
            uploadSubCanvas(1, texFar,  treeScene.farCanvas);
          }

          const isDaylightSun = (activeHour >= 5.6 && activeHour <= 18.7) && state.damped.rainAmt < 0.5 && state.damped.snowAmt < 0.5 && cel.beamFade > 0.25;
          cloudEngine.update(dt, state.passingClouds && isDaylightSun, state.damped.cloudPct, state.simElapsed);

          if (birdEngine.update(dt, state.birdEnabled, isDaylightSun, state.lastWinBounds, cel) && renderFrame) {
            uploadSubCanvas(3, texBird, birdEngine.canvas);
          }
          rainRenderAccum += dt;
          const doRainRender = renderFrame && (isDirectorMode || rainForceRender || rainRenderAccum >= 0.032);
          if (rainEngine.update(dt, state.damped.rainAmt, state.damped.rainIntensity, state.damped.snowAmt, state.damped.snowIntensity, windMs, doRainRender) && renderFrame) {
            rainRenderAccum = 0;
            rainForceRender = false;
            uploadSubCanvas(2, texRain, rainEngine.canvas);
          }
          lightningEngine.update(dt, state.damped.thunderAmt, state.damped.rainIntensity);
        }
        state.liveWindMs = Math.abs(windMs);

        if (renderFrame) {
          drawWebGLFrame(cel);
        }
        return { activeHour, cel };
      }

      function animate(now) {

        if (elapsedMs < (1000.0 / cap - 1.2)) return;

              state.damped.cloudSoft = env.targetCloudSoft;
              state.damped.windMeanMs = env.targetMeanMs;
              state.damped.gustStrengthMs = env.targetGustMs;
              state.damped.rainAmt = env.targetRain;
              state.damped.thunderAmt = env.targetThunder;
              state.damped.snowAmt = env.targetSnow;

              state.damped.snowIntensity = env.targetSnowInt;
              state.damped.sharpness = state.sharpness;

            }
            treeForceRender = true;
            rainForceRender = true;
            if (state.mullionMode !== prevMullion && typeof ensureProgramForMode === 'function') {

            if (needTree) rebuildAndRenderTree();

          },
          showUI(toolbarOn, panelOn, tabId) {

          triggerBird() { birdEngine.triggerNow(); },

          step(dt, count = 1) {

      function sendHostCommand(action, extra = {}) {

      window.obliqueHostSetPaused = function (paused) {

      window.obliqueHostCaptureSnapshot = function (targetW, targetH) {

      function applyExternalConfig(p) {

      function bindExternalSync() {

            const msg = ev && ev.data;
            if (!msg || typeof msg !== 'object') return;
            if (msg.type === 'config') applyExternalConfig(msg.payload);
            else if (msg.type === 'weather') {
              if (applyCachedWeatherPayload(msg.payload, false)) syncUI();
            }
            else if (msg.type === 'reset') {
              const hadCustomCity = state.weatherCityMode === 'custom' || state.weather.source === 'custom';
              const d = new Date();
              Object.assign(state, DEFAULT_CONFIG, {
                hour: d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600
              });
              windEngine.reset(); cloudEngine.reset(); lightningEngine.reset();
              ensureProgramForMode(state.mullionMode, isDirectorMode).catch(() => {});
              rebuildAndRenderTree(); updateRoomGeometry(); applyTranslations(); syncUI();
              if (state.weatherMode === 'live' && hadCustomCity) autoLocateAndFetchWeather(true);
            } else if (msg.type === 'triggerBird') {
              state.birdEnabled = true;
              setPaused(false, false);
              birdEngine.triggerNow();
            }
          };
        }
        window.addEventListener('storage', (ev) => {
          if (ev.key === STORAGE_KEY && ev.newValue) {
            try { applyExternalConfig(JSON.parse(ev.newValue)); } catch (_) {}
          }
        });
      }

      function finishBootSuccess() {
        bootCompleted = true;
        ensureTexturesUploaded();
        resizeCanvas();
        syncUI();
        syncFullscreenButton();
        const initSeason = getActiveSeason();
        if (state.damped.slopeShift === null) state.damped.slopeShift = SEASON_META[initSeason].slopeShift;
        const firstCel = computeSweepLighting(
          state.hour, initSeason, state.sunsetDrama, state.damped.cloudSoft,
          cloudEngine.transmittance, state.damped.rainAmt, state.damped.thunderAmt, state.damped.snowAmt,
          state.damped.slopeShift
        );
        state.lastBeamFade = firstCel.beamFade;
        state.lastWinBounds = computeWallWindowBounds(firstCel);
        drawWebGLFrame(firstCel);
        updateTelemetry(state.hour, firstCel);

        window.obliqueRendererReady = true;
        canvas.classList.add('ready');
        if (bootOverlay) bootOverlay.classList.add('hidden-fade');

        if (isDirectorMode) {
          topToolbar.classList.add('ui-hidden');
          return;
        }

        if (isDesktopWallpaperMode) {
          topToolbar.classList.add('ui-hidden');
          setPanelOpen(false);
        } else {
          if (isHostMode) {
            document.body.classList.add('is-win-host');
            const tabsEl = panelTabsEl || $('panel-tabs');
            if (tabsEl) tabsEl.classList.add('has-4-tabs');
            setActiveTab(state.manualTuning ? activeTabId : 'overview');
            sendHostCommand('getHostState');
          }
          if (isPanelWindowMode) {
            setPanelOpen(true);
          }
        }

        if (isHostMode && !isDesktopWallpaperMode) {
          sendHostCommand('rendererReady');
        }

        bindExternalSync();
        if (!animationLoopStarted) {
          animationLoopStarted = true;
          requestAnimationFrame(() => requestAnimationFrame(animate));
        }
        if (!isDesktopWallpaperMode) scheduleIdleBehavior();
        if (state.weatherMode === 'live') autoLocateAndFetchWeather(true);
        schedulePrewarmMullions(600);
        if (!weatherIntervalStarted) {
          weatherIntervalStarted = true;
          setInterval(() => {
            if (
              state.weatherMode === 'live' && state.weather.loaded && !state.weather.loading &&
              state.weather.source !== 'native' && state.weather.lat != null && state.weather.lon != null &&
              (typeof navigator === 'undefined' || navigator.onLine !== false)
            ) {
              const cachedWx = loadCachedWeather(10 * 60 * 1000);
              if (cachedWx) {
                applyCachedWeatherPayload(cachedWx, false);
                syncUI();
                return;
              }
              const reqId = ++weatherReqSeq;
              fetchOpenMeteo(state.weather.lat, state.weather.lon, state.weather.city, state.weather.source)
                .then(() => { if (reqId === weatherReqSeq) syncUI(); })
                .catch(() => {
                  if (reqId !== weatherReqSeq) return;
                  state.weather.loaded = false;
                  state.weather.error = t('wxRefreshFail');
                  syncUI();
                });
            }
          }, 15 * 60 * 1000);
        }
      }

      function failBoot(err) {
        window.obliqueRendererReady = false;
        showFallback(t('webglFailDesc'));
        if (isHostMode && !isDesktopWallpaperMode) {
          sendHostCommand('rendererError', { message: (err && err.message) ? err.message : 'webgl_error' });
        }
      }

      function bootstrapRenderer({ sync = false } = {}) {
        try {
          if (state.weatherMode === 'live') {
            const cachedWx = loadCachedWeather();
            if (cachedWx) {
              applyCachedWeatherPayload(cachedWx, true);
              syncUI();
            }
          }
          if (!acquireWebGLContext()) {
            failBoot(new Error('WebGL unavailable'));
            return;
          }
          // Kick off active-mode shader compilation first so ANGLE FXC compiles on worker threads
          // in parallel with CPU foliage/tree branch generation.
          const compilePromise = ensureProgramForMode(state.mullionMode, sync);
          if (!sceneAssetsPrepared) prepareSceneAssets();
          ensureTexturesUploaded();

          if (sync || !parallelExt) {
            finishBootSuccess();
          } else {
            compilePromise
              .then(entry => {
                if (entry) finishBootSuccess();
              })
              .catch(err => failBoot(err));
          }
        } catch (err) {
          failBoot(err);
        }
      }

      if (btnWebglRetry) {
        btnWebglRetry.addEventListener('click', () => {
          if (!gl || isContextLost || (typeof gl.isContextLost === 'function' && gl.isContextLost())) {
            window.location.reload();
            return;
          }
          fallbackEl.classList.remove('show');
          topToolbar.classList.remove('hidden');
          applyTranslations();
          if (bootOverlay) bootOverlay.classList.remove('hidden-fade');
          bootstrapRenderer({ sync: isDirectorMode });
        });
      }

      if (isDirectorMode) {
        bootstrapRenderer({ sync: true });
      } else {
        requestAnimationFrame(() => bootstrapRenderer({ sync: false }));
      }
    })();
  </script>
</body>
</html>
